name: Build Windows EXE

on:
  push:
    tags: ['v*']            # ติด tag เช่น v2.0.0 แล้วจะ build + สร้าง Release ให้เอง
  workflow_dispatch:        # หรือกดสั่ง build เองจากหน้า Actions

permissions:
  contents: write

# โปรเจกต์นี้มีข้อความไทยเยอะ ต้องบังคับ UTF-8 ทุก step
# ไม่งั้น console ของ Windows runner (cp1252) จะ UnicodeEncodeError
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Show environment
        run: |
          python -c "import sys;print('python',sys.version);print('stdout',sys.stdout.encoding)"
          chcp

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity check (โหลด profile + คำนวณด้วยข้อมูลจำลอง)
        run: python tools/smoke_test.py

      - name: Build EXE
        run: pyinstaller DentalDX.spec --noconfirm --clean

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/DentalDX.exe)) {
            Write-Error "ไม่พบ dist/DentalDX.exe — PyInstaller ล้มเหลว"; exit 1
          }
          $mb = [math]::Round((Get-Item dist/DentalDX.exe).Length / 1MB, 1)
          Write-Host "EXE size: $mb MB"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python tools/version.py)" >> $GITHUB_OUTPUT

      - name: Package for distribution
        shell: pwsh
        run: |
          $out = "package/DentalDX"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Move-Item dist/DentalDX.exe $out/
          Copy-Item -Recurse profiles  $out/profiles
          Copy-Item -Recurse reference $out/reference
          Copy-Item -Recurse docs      $out/docs
          Copy-Item README.md          $out/
          # ย้ายคู่มือแบบ .txt ขึ้นมาไว้ราก ให้เห็นตั้งแต่แตกไฟล์
          # ใช้ wildcard เพราะชื่อไฟล์เป็นภาษาไทย เลี่ยงปัญหา encoding ใน YAML
          Get-ChildItem "$out/docs" -Filter *.txt | Move-Item -Destination $out -Force
          python tools/make_data_dirs.py $out
          Compress-Archive -Path $out -DestinationPath `
            "DentalDX-v${{ steps.ver.outputs.version }}-win64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DentalDX-win64
          path: DentalDX-v${{ steps.ver.outputs.version }}-win64.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DentalDX-v${{ steps.ver.outputs.version }}-win64.zip
          generate_release_notes: true
          body: |
            ## วิธีใช้

            1. ดาวน์โหลด `DentalDX-v${{ steps.ver.outputs.version }}-win64.zip` แล้วแตกไฟล์
            2. วางไฟล์ข้อมูล `.xlsx` จาก HDC ลงในโฟลเดอร์ `data/<กลุ่มอายุ>/`
            3. ดับเบิลคลิก `DentalDX.exe` — เบราว์เซอร์จะเปิดขึ้นเอง

            ไม่ต้องติดตั้ง Python ไม่ต้องต่ออินเทอร์เน็ต ข้อมูลไม่ออกจากเครื่อง

            > Windows อาจเตือน "Windows protected your PC" เพราะไฟล์ยังไม่ได้เซ็นใบรับรอง
            > กด **More info → Run anyway**
