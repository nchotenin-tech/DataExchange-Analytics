name: Build Windows EXE

on:
  push:
    tags: ['v*']            # ติด tag เช่น v2.0.0 แล้วจะ build + สร้าง Release ให้เอง
  workflow_dispatch:        # หรือกดสั่ง build เองจากหน้า Actions

permissions:
  contents: write

# โปรเจกต์นี้มีข้อความไทยเยอะ ต้องบังคับ UTF-8 ทุก step
# ไม่งั้น console ของ Windows runner (cp1252) จะ UnicodeEncodeError
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Show environment
        run: |
          python -c "import sys;print('python',sys.version);print('stdout',sys.stdout.encoding)"
          chcp

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity check (โหลด profile + คำนวณด้วยข้อมูลจำลอง)
        run: python tools/smoke_test.py

      - name: Build EXE
        run: pyinstaller DentalDX.spec --noconfirm --clean

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/DentalDX.exe)) {
            Write-Error "ไม่พบ dist/DentalDX.exe — PyInstaller ล้มเหลว"; exit 1
          }
          $mb = [math]::Round((Get-Item dist/DentalDX.exe).Length / 1MB, 1)
          Write-Host "EXE size: $mb MB"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python tools/version.py)" >> $GITHUB_OUTPUT

      - name: Package for distribution
        shell: pwsh
        run: |
          $out = "package/DentalDX"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Move-Item dist/DentalDX.exe $out/
          Copy-Item -Recurse profiles  $out/profiles
          Copy-Item -Recurse reference $out/reference
          Copy-Item -Recurse docs      $out/docs
          Copy-Item README.md          $out/
          # ย้ายคู่มือแบบ .txt ขึ้นมาไว้ราก ให้เห็นตั้งแต่แตกไฟล์
          # ใช้ wildcard เพราะชื่อไฟล์เป็นภาษาไทย เลี่ยงปัญหา encoding ใน YAML
          Get-ChildItem "$out/docs" -Filter *.txt | Move-Item -Destination $out -Force
          python tools/make_data_dirs.py $out
          Compress-Archive -Path $out -DestinationPath `
            "DentalDX-v${{ steps.ver.outputs.version }}-win64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DentalDX-win64
          path: DentalDX-v${{ steps.ver.outputs.version }}-win64.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DentalDX-v${{ steps.ver.outputs.version }}-win64.zip
          generate_release_notes: true
          body: |
            ## วิธีใช้

            ### 1. ดาวน์โหลดและแตกไฟล์

            โหลด `DentalDX-v${{ steps.ver.outputs.version }}-win64.zip` แล้วคลิกขวา → Extract All
            (ต้องแตกไฟล์ออกมาก่อน ห้ามเปิด .exe จากในไฟล์ zip)

            ### 2. ดาวน์โหลดข้อมูลจาก HDC แล้ววางให้ถูกโฟลเดอร์

            ไฟล์ Data Exchange ที่โหลดจาก HDC มีชื่อคล้ายกันมากจนแยกไม่ออกว่าเป็นรายงานไหน
            **จึงต้องเปลี่ยนชื่อไฟล์ตามตารางนี้ก่อนวาง**

            **📁 `data/0-5y/` — ต้องใช้ 2 ไฟล์**

            | รายงานใน HDC | ชื่อไฟล์ต้องมีคำว่า |
            |---|---|
            | `1.17.4 OHSP` ร้อยละเด็ก **0-2 ปี** ได้รับการตรวจสุขภาพช่องปาก เฉพาะเขตรับผิดชอบ (คน) (ใช้แบบความครอบคลุม) | **`0-2`** |
            | `1.17.8 OHSP` ร้อยละเด็ก **3-5 ปี** ได้รับการตรวจสุขภาพช่องปาก เฉพาะเขตรับผิดชอบ (คน) (ใช้แบบความครอบคลุม) | **`3-5`** |

            ตัวอย่างชื่อไฟล์ที่ใช้ได้: `dataexchange ตรวจฟันเด็ก 0-2 ปี.xlsx`, `dataexchange ตรวจฟันเด็ก 3-5 ปี.xlsx`

            > ⚠️ ถ้าชื่อไฟล์ไม่มี `0-2` หรือ `3-5` โปรแกรมจะแยกช่วงอายุไม่ได้

            **📁 `data/6-12y/` — ใช้ไฟล์เดียว**

            | รายงานใน HDC | ชื่อไฟล์ |
            |---|---|
            | `1.17.11 OHSP` ร้อยละเด็ก **6-12 ปี** ได้รับการตรวจสุขภาพช่องปาก เฉพาะเขตรับผิดชอบ (คน) (ใช้แบบความครอบคลุม) | ตั้งชื่ออะไรก็ได้ |

            ในแต่ละโฟลเดอร์มีไฟล์ `_วางไฟล์ที่นี่.txt` เขียนคำแนะนำนี้ไว้ให้อีกครั้ง

            ### 3. ดับเบิลคลิก `DentalDX.exe`

            เบราว์เซอร์จะเปิดขึ้นเอง ครั้งแรกใช้เวลาอ่านข้อมูลราว 20-30 วินาที

            ### 4. คลิกตัวเลขในตาราง = ได้รายชื่อเด็กที่ต้องตามต่อ — ใหม่

            ในตารางที่ 1-7 ตัวเลขที่ขีดเส้นใต้คลิกได้ (เฉพาะช่องที่เป็นปัญหา เช่น
            ฟันผุไม่ได้รักษา ฟันถอน ปริทันต์อักเสบ ต้องอุดฟัน ต้องถอนฟัน ไม่ผ่านเกณฑ์)
            จะเปิดรายชื่อเด็กพร้อมคอลัมน์ **ปัญหาที่พบ / สิ่งที่ต้องทำ** ที่สรุป
            treatment need ทั้งหมดเป็นข้อความเดียว เรียงตามหน่วยบริการ
            แล้วส่งออก Excel ไปใช้ติดตามงานได้ทันที

            ในรายชื่อ "ไม่ผ่านเกณฑ์" โปรแกรมจะ **ระบายสีแดงเฉพาะช่องที่เป็นต้นเหตุ**
            และย้ายคอลัมน์นั้นมาไว้ต้นตาราง จึงเห็นทันทีว่าตกเพราะฟิลด์ไหน

            ### 5. กลุ่ม 0-5 ปี — ดูผลรายอายุ และไม่ตัดเด็กที่เพิ่งครบ 6 ปีทิ้ง — ใหม่

            - ใต้แถวช่วงอายุมีแถวย่อยรายอายุ (↳ 0-5 ปี) คลิกดูรายชื่อได้เหมือนกัน
              แถวหลักตามแบบรายงานยังอยู่ครบ · ปรับได้ที่ `split: true` ใน `profiles/0-5y.yaml`
            - เด็กที่วันตรวจคาบเกี่ยวขอบช่วงอายุ เดิมถูกตัดออกจากรายงาน ตอนนี้ **ปรับเข้าช่วงแทน**
              ตามที่รายชื่อจาก HDC คือกลุ่มเป้าหมายอยู่แล้ว — 0-5 ปี: อายุ 6 นับเป็น 5 |
              6-12 ปี: อายุ 5 นับเป็น 6 และอายุ 13 นับเป็น 12
              (`age_clamp` ใน profile — ลบออกได้ถ้าต้องการแบบเดิม)

            ### 6. แท็บ 🔍 สำรวจข้อมูล (EDA) — ใหม่

            อยู่ถัดจากตารางที่ 1-7 ใช้ตรวจสุขภาพข้อมูลก่อนเชื่อผลรายงาน

            - ค่าผิดปกติ/ขัดแย้งกันเอง 13 กฎ (อายุนอกช่วง, GUM ไม่ครบ 6 หลัก,
              ฟันเกินจำนวนจริง, ผุ+อุด มากกว่าฟันที่มี, ซี่ฟันติดลบ, PID ซ้ำ ฯลฯ)
            - Boxplot + ฮิสโทแกรมของจำนวนซี่ฟัน ดู median และ outlier ได้
              คลิกที่แถวเพื่อเปิดกราฟขนาดใหญ่ แล้ว**คลิกที่ตัวเลขหรือแท่งกราฟ
              เพื่อดูว่าเป็นเด็กคนไหน** (ส่งออก Excel/CSV ได้)
            - ความถี่ตัวแปรหมวดหมู่ แปลรหัสเป็นคำอ่านให้อัตโนมัติ
            - Heatmap เทียบ 4 ตัวชี้วัดรายอำเภอในตาเดียว

            ---

            ไม่ต้องติดตั้ง Python ไม่ต้องต่ออินเทอร์เน็ต ข้อมูลไม่ออกจากเครื่อง

            > Windows อาจเตือน "Windows protected your PC" เพราะไฟล์ยังไม่ได้เซ็นใบรับรอง
            > กด **More info → Run anyway**
