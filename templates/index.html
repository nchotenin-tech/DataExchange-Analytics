}

// ---------- รายชื่อเด็กที่ยังไม่ได้ตรวจฟัน ----------
let PENDING = {columns: [], rows: []};

function pendingParams(o) {
  const q = new URLSearchParams({profile: $('#selProfile').value,
    pv: $('#selPv').value, amp: o.amp || $('#selAmp').value,
    kind: o.kind || 'pending'});
  const hos = o.hos || $('#selHos').value;
  if (hos) q.set('hos', hos);
  // kind=value ต้องบอกด้วยว่าคอลัมน์ไหนและเลือกช่วงไหน
  ['col', 'sel', 'lo', 'hi', 'hix', 'table', 'metric', 'row'].forEach(k => {
    if (o[k] !== undefined && o[k] !== null && o[k] !== '') q.set(k, o[k]);
  });
  return q;
}

function visibleCols() {
  const g = PENDING.groups || {};
  const hide = new Set();
  if (!$('#mRaw').checked) (g.raw || []).forEach(c => hide.add(c));
  if (!$('#mCalc').checked) (g.calc || []).forEach(c => hide.add(c));
  return (PENDING.columns || []).filter(c => !hide.has(c));
}

function renderPendingRows(filter) {
  const f = (filter || '').trim().toLowerCase();
  const all = PENDING.columns || [];
  const cols = visibleCols();
  const g = PENDING.groups || {};
  const rawSet = new Set(g.raw || []), calcSet = new Set(g.calc || []);
  const rows = f ? PENDING.rows.filter(r =>
    all.some(c => String(r[c] ?? '').toLowerCase().includes(f))) : PENDING.rows;
  if (!rows.length) {
    $('#mBody').innerHTML = '<div class="msg">ไม่พบรายการ</div>';
    return;
  }
  const cls = c => rawSet.has(c) ? 'c-raw' : calcSet.has(c) ? 'c-calc' : '';
  const th = c => { const k = cls(c); return k ? ` class="${k}"` : ''; };
  // _bad = คอลัมน์ที่ทำให้แถวนี้ตกเกณฑ์ (ส่งมาจากเซิร์ฟเวอร์) -> ระบายแดง
  const anyBad = rows.some(r => (r._bad || []).length);
  $('#mBody').innerHTML =
    `<div class="note">แสดง ${rows.length.toLocaleString('th-TH')} รายการ · ` +
    `${cols.length} คอลัมน์ ` +
    `<span class="lgd"><i class="s-main"></i>สรุป <i class="s-raw"></i>ฟิลด์ต้นฉบับ ` +
    `<i class="s-calc"></i>ค่าที่ระบบคำนวณ${
      anyBad ? '<i class="s-bad"></i>ช่องสีแดง = ค่าที่ทำให้ไม่ผ่านเกณฑ์' : ''}</span>` +
    `<br>หัวตารางและคอลัมน์แรกตรึงไว้แล้ว — เลื่อนแนวนอนที่แถบด้านล่างของตาราง ` +
    `หรือกด <b>Shift + ล้อเมาส์</b>` +
    (PENDING.total > PENDING.shown
      ? `<br>บนหน้าจอจำกัด ${PENDING.shown.toLocaleString('th-TH')} จากทั้งหมด ` +
        `${PENDING.total.toLocaleString('th-TH')} รายการ — ไฟล์ที่ส่งออกครบทุกรายการ` : '') +
    '</div><div class="tw"><table><thead><tr>' +
    cols.map(c => `<th${th(c)}>${esc(c)}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => {
      const bad = new Set(r._bad || []);
      return '<tr>' + cols.map(c => {
        const k = [cls(c), bad.has(c) ? 'badcell' : ''].filter(Boolean).join(' ');
        const v = r[c] === null || r[c] === undefined ? '–' : esc(r[c]);
        return `<td${k ? ` class="${k}"` : ''}${
          bad.has(c) ? ' title="ค่านี้ทำให้ไม่ผ่านเกณฑ์"' : ''}>${v}</td>`;
      }).join('') + '</tr>';
    }).join('') +
    '</tbody></table></div>';
}

const KIND_TITLE = {pending: 'เด็กที่ยังไม่ได้ตรวจฟัน',
                    failed: 'เด็กที่ตรวจแล้วไม่ผ่านเกณฑ์คุณภาพ'};
// คำอธิบายว่าการ์ด/แท่งกราฟที่คลิกมาหมายถึงอะไร
const VALUE_HINT = {
  all: 'ทุกรายที่มีค่า', outlier: 'เฉพาะค่าที่หลุดออกนอกหนวด (outlier)',
  zero: 'เฉพาะค่าที่เป็นศูนย์', neg: 'เฉพาะค่าที่ติดลบ (เป็นไปไม่ได้)',
  extreme: 'เฉพาะค่าต่ำสุดและสูงสุด', iqr: 'เฉพาะค่าในกล่อง Q1–Q3',
  range: 'เฉพาะช่วงที่คลิกจากกราฟ',
};

const KIND_HINT = {
  pending: 'ยังไม่มีวันที่ตรวจในข้อมูล — ควรนัดมาตรวจ',
  failed: 'ตรวจแล้วแต่ข้อมูลตกเกณฑ์คุณภาพ จึงไม่ถูกนับในตารางที่ 2 เป็นต้นไป — ควรตามมาตรวจ/บันทึกใหม่',
};

async function openPending(o, name) {
  const kind = o.kind || 'pending';
  const q = pendingParams({...o, kind});
  $('#mTitle').textContent =
    kind === 'value' ? `${name} — ${VALUE_HINT[o.sel] || ''}` :
    kind === 'metric' ? `เด็กที่ต้องตามต่อ — ${name}` :
    KIND_TITLE[kind] + ' — ' + name;
  $('#mSub').textContent = 'กำลังโหลด…';
  $('#mSearch').value = '';
  $('#mBody').innerHTML = '<div class="msg">กำลังโหลด…</div>';
  $('#modal').hidden = false;
  $('#mCsv').href = '/api/people.csv?' + q;
  $('#mXlsx').href = '/api/people.xlsx?' + q;
  try {
    const d = await api('/api/people?' + q);
    PENDING = d;
    $('#mSub').textContent = `ทั้งหมด ${d.total.toLocaleString('th-TH')} คน — ${
      kind === 'value' ? (d.meta ? d.meta.what : '') + ' ในขอบเขตที่เลือก' :
      kind === 'metric' ? (d.meta ? d.meta.what : '') +
        ' — คอลัมน์แรกสรุปว่าต้องทำอะไรบ้าง ส่งออก Excel เพื่อใช้ติดตามงานได้' :
      KIND_HINT[kind]}`;
    renderPendingRows('');
  } catch (e) {
    $('#mBody').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

$('#mClose').onclick = () => { $('#modal').hidden = true; };
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').hidden = true; };
$('#zClose').onclick = () => { $('#zmodal').hidden = true; };
$('#zmodal').onclick = e => { if (e.target.id === 'zmodal') $('#zmodal').hidden = true; };
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  // ปิดทีละชั้น: รายชื่อเด็กเปิดทับกราฟขยายอยู่ จึงต้องปิดก่อน
  if (!$('#modal').hidden) $('#modal').hidden = true;
  else $('#zmodal').hidden = true;
});

// คลิกช่องตัวเลขที่เป็นปัญหาในตารางรายงาน -> รายชื่อเด็กที่ต้องตามต่อ
$('#body').addEventListener('click', e => {
  const td = e.target.closest('td.drill');
  if (!td) return;
  e.stopPropagation();          // กันไม่ให้ไป drill-down อำเภอพร้อมกัน
  openPending({kind: 'metric', table: td.dataset.tno, metric: td.dataset.met,
               row: td.dataset.row},
              `${td.dataset.met} · ${td.dataset.row === 'รวม' ? 'ทุกอายุ'
                : 'อายุ ' + td.dataset.row}`);
});

// คลิกแถวใดก็ได้ในตารางการกระจายของค่าตัวเลข -> เปิดกราฟขนาดใหญ่
// ผูกที่ #body ครั้งเดียว เพราะเนื้อหาแท็บถูกสร้างใหม่ทุกครั้งที่โหลด
$('#body').addEventListener('click', e => {
  const row = e.target.closest('tr.zoomrow');
  if (row) openZoom(Number(row.dataset.zoom));
});
$('#mSearch').oninput = e => renderPendingRows(e.target.value);
$('#mRaw').onchange = $('#mCalc').onchange = () => renderPendingRows($('#mSearch').value);

async function loadReport(refresh) {
  const p = $('#selProfile').value;
  if (!p) return;
  $('#body').innerHTML = '<div class="msg">กำลังคำนวณ…</div>';
  const q = new URLSearchParams({profile: p, pv: $('#selPv').value,
    amp: $('#selAmp').value, hos: $('#selHos').value});
  if (refresh) q.set('refresh', '1');
  try {
    const r = await api('/api/report?' + q);
    CURRENT = r;
    const parts = [r.scope.pvname, r.scope.ampname,
      r.scope.hoscode ? $('#selHos').selectedOptions[0].text : null].filter(Boolean);
    $('#title').textContent = `สรุปผลการสำรวจสภาวะช่องปาก — ${r.profile.label}`;
    $('#scope').textContent = 'ขอบเขต: ' + (parts.length ? parts.join(' › ') : 'ทุกพื้นที่ในข้อมูล');
    kpiCards(r.summary);
    const qa = new URLSearchParams({profile: p, pv: $('#selPv').value,
      amp: $('#selAmp').value, hos: $('#selHos').value, table: 'all'});
    $('#topExport').innerHTML =
      `<a class="dl sm primary" href="/api/table.xlsx?${qa}"
          title="ทุกตารางในไฟล์เดียว แยกเป็นชีต">⬇ ส่งออกทุกตาราง (Excel)</a>`;

    // ---- แบ่งเป็นแท็บ: ภาพรวม + รายงานทีละตาราง ----
    const areaRows = r.level === 'unit' ? r.units : r.districts;
    const tabs = [{id: 'overview', label: 'ภาพรวม', sub: 'เปรียบเทียบพื้นที่'}]
      .concat(r.tables.map(t => ({
        id: 't' + t.no, label: 'ตารางที่ ' + t.no, sub: shortTitle(t.title)})))
      .concat([{id: 'eda', label: '🔍 สำรวจข้อมูล', sub: 'คุณภาพ · การกระจาย'},
               {id: 'ask', label: '💬 ถาม-ตอบ', sub: 'พิมพ์คำถามเป็นภาษาสนทนา'}]);

    $('#body').innerHTML =
      `<div class="tabbar">${tabs.map(x =>
        `<button class="tab" data-tab="${x.id}">
           <b>${esc(x.label)}</b><span>${esc(x.sub)}</span></button>`).join('')}</div>
       <div class="pane" data-tab="overview">
         ${renderOverview(areaRows, r.overview_labels, r.level)}</div>` +
      r.tables.map(t => `<div class="pane" data-tab="t${t.no}" hidden>
         ${renderTable(t)}</div>`).join('') +
      '<div class="pane" data-tab="eda" hidden></div>' +
      '<div class="pane" data-tab="ask" hidden></div>';
    EDA_CACHE = null;      // ขอบเขตอาจเปลี่ยน ต้องคำนวณใหม่

    // เลือกแท็บเดิมไว้ถ้ายังมีอยู่ (เช่นตอนเปลี่ยนพื้นที่)
    if (!tabs.some(x => x.id === ACTIVE_TAB)) ACTIVE_TAB = 'overview';
    $('#body').querySelectorAll('button.tab').forEach(b => {
      b.onclick = () => selectTab(b.dataset.tab);
    });
    selectTab(ACTIVE_TAB);
    // ปุ่มกลับจากระดับหน่วยบริการ -> ระดับอำเภอ
    const back = $('#btnBack');
    if (back) back.onclick = () => {
      $('#selAmp').value = '';
      $('#selHos').value = '';
      refreshAreaSelects();
      loadReport(false);
      window.scrollTo({top: 0, behavior: 'smooth'});
    };
    // ปุ่มสลับกราฟ / สรุปประเด็น ของแต่ละตาราง
    const toggles = [['chartbtn', '.tchart', '📊 ดูกราฟ', '✕ ซ่อนกราฟ'],
                     ['insbtn', '.insight', '💡 สรุปประเด็น', '✕ ซ่อนสรุป']];
    toggles.forEach(([cls, sel, offTxt, onTxt]) => {
      $('#body').querySelectorAll('button.' + cls).forEach(b => {
        b.onclick = () => {
          const box = b.closest('section').querySelector(sel);
          box.hidden = !box.hidden;
          b.textContent = box.hidden ? offTxt : onTxt;
          b.classList.toggle('on', !box.hidden);
        };
      });
    });
    // ปุ่มดูเด็กที่ยังไม่ได้ตรวจฟัน
    $('#body').querySelectorAll('button.mini[data-name]').forEach(b => {
      b.onclick = ev => {
        ev.stopPropagation();
        openPending({amp: b.dataset.amp, hos: b.dataset.hos, kind: b.dataset.kind},
                    b.dataset.name);
      };
    });
    // คลิกแถวอำเภอ -> ไล่ลงรายหน่วยบริการ
    $('#body').querySelectorAll('tr.clickable').forEach(tr => {
      tr.onclick = () => {
        $('#selAmp').value = tr.dataset.amp;
        $('#selHos').value = '';
        refreshAreaSelects();
        loadReport(false);
        window.scrollTo({top: 0, behavior: 'smooth'});
      };
    });
  } catch (e) {
    $('#cards').innerHTML = '';
    $('#body').innerHTML = `<section><div class="err"><b>เกิดข้อผิดพลาด</b><br>${e.message}</div></section>`;
  }
}

async function loadAreas() {
  try { AREAS = await api('/api/areas?profile=' + $('#selProfile').value); }
  catch { AREAS = {}; }
  ['selPv', 'selAmp', 'selHos'].forEach(id => $('#' + id).value = '');
  refreshAreaSelects();
}

async function init() {
  const profs = await api('/api/profiles');
  $('#selProfile').innerHTML = profs.map(p =>
    `<option value="${p.id}">${p.label}${p.files ? '' : '  (ยังไม่มีไฟล์ข้อมูล)'}</option>`).join('');
  if (!profs.length) {
    $('#body').innerHTML = '<section><div class="err">ไม่พบ profile ใน profiles/ — ' +
      'กรุณาวางไฟล์ .yaml อย่างน้อย 1 ไฟล์</div></section>';
    return;
  }
  await loadAreas();
  await loadReport(false);
}

$('#selProfile').onchange = async () => { await loadAreas(); loadReport(false); };
$('#selPv').onchange = () => { $('#selAmp').value=''; $('#selHos').value='';
  refreshAreaSelects(); loadReport(false); };
$('#selAmp').onchange = () => { $('#selHos').value=''; refreshAreaSelects(); loadReport(false); };
$('#selHos').onchange = () => loadReport(false);
$('#btnRefresh').onclick = async () => { await loadReport(true); await loadAreas(); };

init();
</script>
</body>
</html>
