<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DentalDX — วิเคราะห์ข้อมูล Data Exchange ทันตสุขภาพ</title>
<style>
:root{
  --bg:#eef5fb; --panel:#fff; --ink:#17364f; --ink2:#3d5f7d; --muted:#7c96ad; --line:#e2eef8;
  --sky:#2f9fdc; --mint:#1cbfa0; --sun:#f5a623; --coral:#fb7185; --lav:#8e86ee;
  --r:16px; --r2:10px; --sh:0 1px 2px rgba(23,54,79,.05), 0 6px 18px rgba(23,54,79,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Sarabun","Leelawadee UI","Noto Sans Thai",Tahoma,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
.app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
aside{width:272px;flex:0 0 272px;position:fixed;inset:0 auto 0 0;overflow-y:auto;z-index:60;
  background:linear-gradient(170deg,#0d4d8c 0%,#1b5fbe 40%,#4331a8 100%);
  color:#fff;padding:20px 16px 28px;box-shadow:2px 0 18px rgba(13,45,90,.22)}
.brand{display:flex;gap:11px;align-items:center;padding-bottom:15px;margin-bottom:12px;
  border-bottom:1px solid rgba(255,255,255,.28)}
.brand .logo{width:46px;height:46px;flex:0 0 46px;border-radius:14px;overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,.22)}
.brand .logo svg{width:100%;height:100%;display:block}
.brand b{display:block;font-size:15.5px;line-height:1.25;letter-spacing:.01em}
.brand span{font-size:11.5px;color:#bcd8f7}

aside label{display:block;font-size:11.5px;color:#c9e0fa;font-weight:600;
  margin:15px 0 6px;letter-spacing:.03em}
aside select{width:100%;font-family:inherit;font-size:13.5px;font-weight:500;
  padding:10px 12px;border-radius:var(--r2);border:1px solid rgba(255,255,255,.35);
  background:#fff;color:#17364f;outline:none;cursor:pointer;
  box-shadow:0 2px 6px rgba(6,32,66,.18)}
aside select:hover{border-color:#fff}
aside select:focus{border-color:#ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.35)}
aside select option{color:#17364f}

aside button#btnRefresh{width:100%;font-family:inherit;font-size:13.5px;font-weight:700;
  padding:11px 12px;margin-top:20px;border-radius:var(--r2);border:0;cursor:pointer;
  background:#ffd166;color:#5a3c00;box-shadow:0 3px 10px rgba(0,0,0,.2)}
aside button#btnRefresh:hover{background:#ffdd8a}
aside button#btnRefresh:active{transform:translateY(1px)}

.stale{position:fixed;top:0;left:0;right:0;z-index:300;background:#f5a623;color:#5a3c00;
  font-size:13px;padding:9px 16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.stale button{margin-left:10px;font-family:inherit;font-size:12.5px;padding:4px 12px;
  border:0;border-radius:7px;background:#5a3c00;color:#fff;cursor:pointer}
.ver{font-size:11px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  border-radius:8px;padding:5px 9px;margin:0 0 4px;text-align:center;color:#d8e9fb}
.hint{font-size:11.5px;color:#b9d4f2;margin-top:20px;padding-top:15px;
  border-top:1px solid rgba(255,255,255,.24);line-height:1.6}
.hint code{background:rgba(255,255,255,.16);color:#e8f3ff;padding:1px 5px;
  border-radius:5px;font-size:11px}

/* ---------- main ---------- */
main{margin-left:270px;flex:1;padding:26px 30px 60px;min-width:0}
h1{font-size:21px;margin:0 0 3px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px;display:flex;align-items:center;gap:14px}
#topExport{margin-left:auto}
span.xp{margin-left:auto;display:inline-flex;gap:7px;flex:0 0 auto}
h2 .mini.right + .xp{margin-left:10px}
.dl.sm{font-size:11.5px;padding:5px 11px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px}
.card{background:var(--panel);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.card .k{font-size:11.5px;color:var(--muted)}
.card .v{font-size:25px;font-weight:700;line-height:1.25;margin-top:2px}
.card .u{font-size:11.5px;color:var(--ink2)}
.c-sky .v{color:var(--sky)} .c-mint .v{color:var(--mint)}
.c-sun .v{color:var(--sun)} .c-lav .v{color:var(--lav)}
.c-teal .v{color:#0d9488} .c-indigo .v{color:#4f46e5}

/* ---------- หน้าสำรวจข้อมูล (EDA) ---------- */
.hint2{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.hint3{font-size:11px;color:var(--muted)}
td.warnval{color:#dc2626;font-weight:700}
td.barcell{width:1%;padding-right:14px}
.pb{display:block;width:100%;min-width:90px;height:8px;border-radius:4px;
  background:#eef2f6;overflow:hidden}
.pb i{display:block;height:100%;border-radius:4px;background:var(--sky)}
.pb i.ok{background:#16a34a} .pb i.mid{background:#f59e0b} .pb i.low{background:#ef4444}
td.boxcell{padding:2px 8px}
svg.box{display:block}
.spark{display:inline-flex;align-items:flex-end;gap:1px;height:30px;min-width:96px}
.spark i{display:block;width:6px;background:#93c5fd;border-radius:2px 2px 0 0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ccard{border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px;background:#fbfdff}
.chead{font-size:12.5px;color:var(--ink);margin-bottom:6px}
.chead span{color:var(--muted);font-size:11px;margin-left:4px}
.chead em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:1px}
.ccard table{font-size:12px}
.ccard td{padding:3px 6px;border-bottom:1px solid #eef4f9}
.ccard td.cv{font-weight:600;color:var(--ink2);white-space:nowrap}
.ccard td.cl{color:var(--muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.ccard td.cn{text-align:right;white-space:nowrap}
.ccard td.cp{text-align:right;color:var(--sky);font-weight:600;white-space:nowrap}
td.hm{text-align:center;font-weight:700;font-size:12.5px;min-width:96px}

/* ---------- แถบเลือกรายงาน ---------- */
.tabbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px}
button.tab{flex:0 0 auto;font-family:inherit;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:9px 15px;min-width:132px;color:var(--ink2);box-shadow:var(--sh);
  transition:transform .12s,box-shadow .12s}
button.tab b{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:1.3}
button.tab span{display:block;font-size:11px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
button.tab:hover{transform:translateY(-1px);border-color:#bcdcf5}
button.tab.on{background:linear-gradient(160deg,#2f9fdc,#4f46e5);border-color:transparent;
  box-shadow:0 4px 14px rgba(47,110,220,.35)}
button.tab.on b{color:#fff}
button.tab.on span{color:#dbe9fb}
.pane[hidden]{display:none}

section{background:var(--panel);border-radius:var(--r);padding:20px 22px;margin-bottom:20px;box-shadow:var(--sh)}
section h2{font-size:15.5px;margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
section h2 .no{background:var(--sky);color:#fff;border-radius:7px;font-size:11.5px;
  padding:2px 8px;font-weight:600;flex:0 0 auto}
.cond{font-size:11.5px;color:var(--muted);margin:6px 0 14px;padding-left:2px}
.cond div{margin:1px 0}

.tw{overflow-x:auto;border-radius:var(--r2);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:7px 11px;text-align:right;border-bottom:1px solid var(--line)}
th{background:#f5fafe;color:var(--ink2);font-weight:600;font-size:12px;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:2}
th:first-child{background:#f5fafe;z-index:3}
tbody tr:hover td{background:#f8fcff}
tbody tr:hover td:first-child{background:#f8fcff}
tr.total td{font-weight:700;background:#eef7fd;border-top:2px solid var(--sky)}
tr.total td:first-child{background:#eef7fd}
th.grp{text-align:center;border-left:1px solid var(--line)}
td.pct{color:var(--sky);font-weight:600}

.msg{padding:40px;text-align:center;color:var(--muted)}
.err{background:#fff2f4;color:#c2415a;border-radius:var(--r2);padding:14px 16px;font-size:13px}
/* ---------- กราฟ ---------- */
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:2px 0 8px;font-size:12px;color:var(--ink2)}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend .lg i{width:13px;height:13px;border-radius:4px;display:inline-block}
.chartwrap{overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chartwrap svg{display:block;max-width:none}
.gb rect{transition:opacity .15s}
.chartwrap svg:hover .gb rect{opacity:.45}
.chartwrap svg .gb:hover rect{opacity:1}
/* ---------- ปุ่มเล็ก + ป๊อปอัพ ---------- */
button.mini{font-family:inherit;font-size:11.5px;padding:4px 10px;border-radius:8px;
  border:1px solid #cfe6f7;background:#f2f9fe;color:#2f6fa8;cursor:pointer;white-space:nowrap}
button.mini:hover{background:#2f9fdc;color:#fff;border-color:#2f9fdc}
button.mini.back{font-size:12px;padding:5px 12px;font-weight:600;flex:0 0 auto;
  border-color:#bcdcf5;background:#eaf5fd;color:#1b5fbe}
button.mini.back:hover{background:#1b5fbe;color:#fff;border-color:#1b5fbe}
button.mini.warn{border-color:#f6d6a8;background:#fef6ea;color:#b8770f}
button.mini.warn:hover{background:#f5a623;color:#fff;border-color:#f5a623}
button.mini + button.mini{margin-left:5px}
span.hgrp{margin-left:auto;display:inline-flex;gap:6px;flex:0 0 auto}
span.hgrp + .xp{margin-left:10px}
button.mini.chartbtn{margin-left:auto;font-size:12px;padding:5px 12px;
  border-color:#cbd5ff;background:#eef1ff;color:#4338ca}
button.mini.chartbtn:hover,button.mini.chartbtn.on{background:#4f46e5;color:#fff;
  border-color:#4f46e5}
button.mini.chartbtn + .xp{margin-left:8px}
button.mini.insbtn{margin-left:auto;font-size:12px;padding:5px 12px;
  border-color:#fde6b0;background:#fff8e8;color:#a8730c}
button.mini.insbtn:hover,button.mini.insbtn.on{background:#f5a623;color:#fff;border-color:#f5a623}
button.mini.insbtn + .chartbtn{margin-left:6px}

/* ---------- สรุปประเด็น ---------- */
.insight{border:1px solid #ffe8bd;background:linear-gradient(180deg,#fffaf0,#fff);
  border-radius:var(--r2);padding:14px 16px;margin-bottom:16px}
.insight[hidden]{display:none}
.ihead{font-size:13px;font-weight:700;color:#a8730c;margin-bottom:8px}
.ilist{margin:0 0 4px;padding:0;list-style:none}
.ilist li{position:relative;padding:3px 0 3px 22px;font-size:13px;line-height:1.55;color:var(--ink)}
.ilist li b{position:absolute;left:0;top:3px;width:16px;text-align:center;font-size:11px}
.ilist li.t-good b{color:#16a34a} .ilist li.t-warn b{color:#d97706}
.ilist li.t-bad b{color:#dc2626}  .ilist li.t-info b{color:var(--sky)}
.isub{font-size:12px;font-weight:600;color:var(--ink2);margin:12px 0 7px;
  padding-top:10px;border-top:1px dashed #f0dcb4}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:8px}
.icard{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.5;
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.icard .ik{flex:0 0 auto;min-width:34px;text-align:center;font-weight:700;font-size:12px;
  border-radius:6px;padding:2px 7px;background:#eef4fa;color:var(--ink2)}
.icard.t-good{border-color:#bbf0d0;background:#f4fdf7}
.icard.t-good .ik{background:#dcfce7;color:#15803d}
.icard.t-warn{border-color:#fde3b0;background:#fffbf2}
.icard.t-warn .ik{background:#fef3c7;color:#b45309}
.icard.t-bad{border-color:#fecdd3;background:#fff6f7}
.icard.t-bad .ik{background:#ffe4e6;color:#be123c}
.tchart{border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px 6px;
  margin-bottom:16px;background:#fbfdff}
.tchart .ctitle{font-size:12px;color:var(--muted);margin-bottom:6px}
.tchart[hidden]{display:none}
/* ตรึงคอลัมน์ "ติดตาม" ไว้ขอบขวา จะได้ไม่ตกขอบจอเวลาตารางกว้าง */
td.act,th.act{text-align:left;position:sticky;right:0;background:#fff;z-index:2;
  box-shadow:-6px 0 8px -6px rgba(23,54,79,.18)}
th.act{background:#f5fafe;z-index:3}
tbody tr:hover td.act{background:#f8fcff}
tr.clickable:hover td.act{background:#eaf5ff}
/* แถวย่อยรายอายุที่แตกจากช่วงอายุ — ข้อมูลเสริม ไม่ใช่แถวของแบบรายงาน */
tr.subrow td{background:#fbfdff;color:var(--ink2);font-size:12.5px}
tr.subrow td:first-child{padding-left:26px;color:var(--muted)}
span.ok{font-size:11.5px;color:var(--mint)}
/* ช่องตัวเลขที่คลิกดูรายชื่อเด็กได้ */
td.drill{cursor:pointer;color:#1f6fb2;font-weight:600;
  text-decoration:underline dotted #9ec9e8 2px;text-underline-offset:3px}
td.drill:hover{background:#e8f4ff;text-decoration-color:#1f6fb2}

.modal{position:fixed;inset:0;z-index:200;background:rgba(23,54,79,.45);
  display:flex;align-items:center;justify-content:center;padding:24px}
.modal[hidden]{display:none}
.sheet{background:#fff;border-radius:var(--r);width:min(1180px,100%);max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(23,54,79,.3)}
.sheet header{display:flex;align-items:center;gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--line)}
.sheet header b{font-size:15.5px}
.sheet header span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.sheet .x{margin-left:auto;border:0;background:#f2f7fb;color:var(--ink2);cursor:pointer;
  width:32px;height:32px;border-radius:9px;font-size:14px}
.sheet .x:hover{background:#e5eef6}
.sheet .bar{display:flex;gap:10px;align-items:center;padding:12px 20px;background:#f8fbfe;
  border-bottom:1px solid var(--line)}
.sheet .bar input{flex:1;font-family:inherit;font-size:13px;padding:8px 12px;
  border:1px solid var(--line);border-radius:9px;outline:none;background:#fff}
.sheet .bar input:focus{border-color:var(--sky)}
/* ใช้ได้ทั้ง <a> และ <button> — เดิมเขียนเป็น a.dl ทำให้ปุ่มไม่ได้สไตล์เลย */
.dl{display:inline-flex;align-items:center;gap:5px;font-family:inherit;line-height:1.5;
  font-size:12.5px;padding:8px 14px;border-radius:9px;text-decoration:none;
  border:1px solid #cfe6f7;color:#2f6fa8;background:#fff;white-space:nowrap;cursor:pointer}
.dl:hover{background:#eaf5fd;border-color:#a9d4f2}
.dl:active{transform:translateY(1px)}
.dl:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.dl.primary{background:#1cbfa0;border-color:#1cbfa0;color:#fff}
.dl.primary:hover{background:#16a88c;border-color:#16a88c}
.dl.on{background:#eaf5fd;border-color:var(--sky);color:var(--sky);font-weight:600}
/* ป๊อปอัพกราฟขนาดใหญ่ */
.zsheet{width:min(1000px,100%)}
.zbody{overflow:auto;padding:16px 22px 22px}
.zbody svg{display:block;width:100%;height:auto}
.zbody .bighist{margin-bottom:2px}
.zbody .ztitle{font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 4px}
.zbody .zhelp{font-size:12px;color:var(--muted);line-height:1.8;margin-top:6px;
  border-top:1px dashed var(--line);padding-top:10px}
.zbody text.ax{font-size:11px;fill:#7b8b9a}
.zbody text.vl{font-size:11px;fill:#3f6b93;font-weight:600}
.zbody text.bl{font-size:12px;fill:#31536f;font-weight:600}
.zbody text.bl.red{fill:#c0392b}
.zstats{display:flex;flex-wrap:wrap;gap:8px}
.zstats .st{flex:1 1 118px;background:#f6fafd;border:1px solid var(--line);
  border-radius:10px;padding:8px 10px}
.zstats .st b{display:block;font-size:14px;color:var(--ink)}
.zstats .st span{font-size:11.5px;color:var(--muted)}
.zstats .st.bad{background:#fff5f4;border-color:#f3cfc9}
.zstats .st.bad b{color:#c0392b}
.zstats .st.clk{cursor:pointer}
.zstats .st.clk:hover{border-color:var(--sky);box-shadow:0 2px 8px rgba(47,111,168,.18)}
.zstats .st em{display:block;font-size:10.5px;color:#2f6fa8;font-style:normal;margin-top:3px}
.zstats .st.bad em{color:#c0392b}
.zbody .zclick{font-weight:400;color:#2f6fa8;margin-left:8px}
.zbody g.clkbar{cursor:pointer}
.zbody g.clkbar:hover rect{fill:#3f8fd0}
/* หน้าต่างรายชื่อเด็กต้องอยู่บนกราฟขยายเสมอ เพราะเปิดต่อจากกัน */
#modal{z-index:220}
tr.zoomrow{cursor:zoom-in}
tr.zoomrow:hover td{background:#eff8ff}
td.zoomcell{text-align:right;white-space:nowrap}
.zbtn{font-size:11.5px;color:#2f6fa8;border:1px solid #cfe6f7;background:#fff;
  border-radius:8px;padding:3px 9px}
tr.zoomrow:hover .zbtn{background:#2f6fa8;border-color:#2f6fa8;color:#fff}

/* ตารางรายบุคคลกว้าง 70+ คอลัมน์ ยาวหลักพันแถว
   ต้องให้กล่อง .tw เป็นตัวเลื่อนเพียงตัวเดียว (ไม่ใช่ .mbody)
   ไม่งั้นหัวตารางไม่ยึดติด และแถบเลื่อนแนวนอนจะไปอยู่ใต้แถวสุดท้ายจนกดไม่ถึง */
.mbody{flex:1;min-height:0;display:flex;flex-direction:column;
  overflow:hidden;padding:0 20px 16px}
.mbody .tw{flex:1;min-height:0;overflow:auto}
.mbody table{white-space:nowrap;font-size:12.5px}
.mbody th,.mbody td{padding:5px 9px}
.mbody th{position:sticky;top:0;z-index:2;background:#f5fafe;
  box-shadow:0 1px 0 var(--line)}
.mbody th:first-child{z-index:4}
.mbody td:first-child{background:#fff}
/* แถบเลื่อนให้เห็นชัด ไม่ใช่เส้นบางจนหาไม่เจอ */
.mbody .tw::-webkit-scrollbar{width:14px;height:14px}
.mbody .tw::-webkit-scrollbar-track{background:#eef4f9;border-radius:8px}
.mbody .tw::-webkit-scrollbar-thumb{background:#9fbdd6;border-radius:8px;
  border:3px solid #eef4f9}
.mbody .tw::-webkit-scrollbar-thumb:hover{background:#7ba5c6}
.mbody .tw{scrollbar-color:#9fbdd6 #eef4f9}
/* คอลัมน์กลุ่มต่าง ๆ ใช้สีพื้นแยกให้ดูออกว่าเป็นค่าดิบหรือค่าที่คำนวณ */
.mbody th.c-raw{background:#fdf6ec}  .mbody td.c-raw{background:#fffcf6}
.mbody th.c-calc{background:#eef7f4} .mbody td.c-calc{background:#f7fdfb}
/* ช่องที่ทำให้แถวนี้ตกเกณฑ์คุณภาพ — ต้องเด่นกว่าสีกลุ่มคอลัมน์ */
.mbody td.badcell{background:#ffe3de !important;color:#b3261e;font-weight:700;
  box-shadow:inset 0 0 0 1px #f0a89d}
.mbody tbody tr:hover td.badcell{background:#ffd5cd !important}
.lgd i.s-bad{background:#ffe3de;border-color:#f0a89d}
.mbody tbody tr:hover td{background:#eaf5ff}
.note{font-size:11.5px;color:var(--muted);padding:10px 0 6px;line-height:1.7}
.lgd{margin-left:8px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;
  vertical-align:-1px;border:1px solid var(--line)}
.lgd i.s-main{background:#fff} .lgd i.s-raw{background:#fdf6ec}
.lgd i.s-calc{background:#eef7f4}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);
  white-space:nowrap;cursor:pointer;user-select:none}
label.chk input{cursor:pointer;accent-color:var(--sky);width:15px;height:15px}

tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#eaf5ff}
tr.clickable:hover td:first-child{background:#eaf5ff}
td .code{display:inline-block;font-size:11px;color:var(--muted);background:#f2f7fb;
  border-radius:5px;padding:0 5px;margin-right:2px}
td.pct2{color:#0d9488;font-weight:600}

/* ---------- แท็บถาม-ตอบ ---------- */
.askbar{display:flex;gap:8px;margin-bottom:12px}
.askbar input{flex:1;font-family:inherit;font-size:14px;padding:11px 14px;
  border:1px solid var(--line);border-radius:var(--r2);background:#fff;color:var(--ink);
  outline:none;box-shadow:var(--sh)}
.askbar input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(47,159,220,.18)}
.askbar button{font-family:inherit;font-size:14px;font-weight:600;padding:11px 20px;
  border:0;border-radius:var(--r2);background:linear-gradient(160deg,#2f9fdc,#4f46e5);
  color:#fff;cursor:pointer;box-shadow:var(--sh)}
.askbar button:disabled{opacity:.55;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{font-family:inherit;font-size:12px;padding:5px 11px;cursor:pointer;
  border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink2)}
.chips button:hover{border-color:var(--sky);color:var(--sky)}
.answer{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--sh);margin-bottom:12px}
.answer .txt{font-size:15px;line-height:1.85;white-space:pre-wrap}
.answer .q{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.answer .meta{font-size:11.5px;color:var(--muted);margin-top:12px;padding-top:10px;
  border-top:1px dashed var(--line);line-height:1.8}
.answer .meta b{color:var(--ink2);font-weight:600}
.aitag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;
  border-radius:999px;background:#eef7f4;color:#0d9488;margin-left:6px}
.aitag.rules{background:#fdf6ec;color:#b26a00}

/* ---------- กล่องยืนยันก่อนส่งข้อมูลออก ---------- */
.confirm{background:#fffbf3;border:1px solid #f0d9a8;border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--sh);margin-bottom:12px}
.confirm.local{background:#f2fbf8;border-color:#a8e0d2}
.confirm h4{margin:0 0 10px;font-size:14.5px;color:#8a5a00}
.confirm.local h4{color:#0d7d68}
.confirm dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px;
  font-size:12.5px;color:var(--ink2)}
.confirm dt{color:var(--muted)}
.confirm dd{margin:0;word-break:break-all}
.confirm pre{background:#fff;border:1px solid var(--line);border-radius:var(--r2);
  padding:11px 13px;margin:0 0 10px;font-size:11.5px;line-height:1.65;max-height:260px;
  overflow:auto;white-space:pre-wrap;word-break:break-word;
  font-family:"Cascadia Mono",Consolas,"Courier New",monospace}
.confirm .lbl{font-size:11.5px;color:var(--muted);margin:0 0 4px;font-weight:600}
.confirm .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm button{font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 18px;
  border-radius:var(--r2);border:0;cursor:pointer}
.confirm button.go{background:linear-gradient(160deg,#2f9fdc,#4f46e5);color:#fff}
.confirm button.no{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.confirm button.fmt{background:#fff;border:1px solid var(--line);color:var(--muted);
  font-size:11.5px;padding:4px 10px;font-weight:500}
.outbox{font-size:12px;color:var(--ink2)}
.outbox td{padding:5px 9px}

/* ---------- หน้าตั้งค่า AI ---------- */
.aiset{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--sh);margin-bottom:14px}
.aiset h3{margin:0 0 12px;font-size:14.5px;color:var(--ink)}
.modes{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.modes label{flex:1 1 220px;display:flex;gap:9px;align-items:flex-start;cursor:pointer;
  border:1.5px solid var(--line);border-radius:var(--r2);padding:11px 13px;background:#fff}
.modes label:hover{border-color:#bcdcf5}
.modes label.on{border-color:var(--sky);background:#f4fbff}
.modes input{margin-top:3px;accent-color:var(--sky);cursor:pointer}
.modes b{display:block;font-size:13px;color:var(--ink)}
.modes span{display:block;font-size:11.5px;color:var(--muted);line-height:1.55}
.frm{display:grid;grid-template-columns:132px 1fr;gap:9px 12px;align-items:center;
  margin-bottom:12px}
.frm label{font-size:12.5px;color:var(--ink2)}
.frm input,.frm select{font-family:inherit;font-size:13px;padding:8px 11px;width:100%;
  border:1px solid var(--line);border-radius:var(--r2);background:#fff;color:var(--ink);
  outline:none}
.frm input:focus,.frm select:focus{border-color:var(--sky);
  box-shadow:0 0 0 3px rgba(47,159,220,.15)}
.frm .row{display:flex;gap:8px;align-items:center}
.frm .hint{grid-column:2;font-size:11.5px;color:var(--muted);margin:-4px 0 2px}
.aiset .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.aiset .acts button{font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 18px;
  border-radius:var(--r2);border:0;cursor:pointer}
.aiset .acts button.save{background:linear-gradient(160deg,#2f9fdc,#4f46e5);color:#fff}
.aiset .acts button.alt{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.aiset .msg2{font-size:12.5px;padding:8px 12px;border-radius:var(--r2);margin-top:10px}
.aiset .msg2.good{background:#eef7f4;color:#0d7d68}
.aiset .msg2.bad{background:#ffe9e5;color:#b3261e}
.aiset .warn{font-size:12px;color:#8a5a00;background:#fffbf3;border:1px solid #f0d9a8;
  border-radius:var(--r2);padding:9px 12px;margin-bottom:12px;line-height:1.7}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="DentalDX">
        <defs>
          <linearGradient id="lgbg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#eaf6ff"/><stop offset="100%" stop-color="#cfe6fb"/>
          </linearGradient>
          <linearGradient id="lgtooth" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dbeeff"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="14" fill="url(#lgbg)"/>
        <!-- ใบหน้าเด็ก -->
        <circle cx="21" cy="21.5" r="13" fill="#ffd7b0"/>
        <path d="M8.2 21.5C8.2 13.9 14 7.8 21 7.8s12.8 6.1 12.8 13.7c-1.9-3.4-5-5.2-8.4-5.6
                 -4.6-.6-9.2.9-12.4 3.4-1.7 1.3-3.2 2.9-4.8 2.2z" fill="#5b4636"/>
        <circle cx="16.4" cy="22.4" r="1.7" fill="#4a3728"/>
        <circle cx="25.6" cy="22.4" r="1.7" fill="#4a3728"/>
        <ellipse cx="12.6" cy="26.4" rx="2.2" ry="1.5" fill="#ff9d9d" opacity=".55"/>
        <ellipse cx="29.4" cy="26.4" rx="2.2" ry="1.5" fill="#ff9d9d" opacity=".55"/>
        <path d="M16 27.6c1.4 3.2 8.6 3.2 10 0z" fill="#fff" stroke="#c9744f"
              stroke-width="1.2" stroke-linejoin="round"/>
        <!-- ฟันน้ำนมมุมขวาล่าง -->
        <circle cx="36" cy="35" r="10.5" fill="#2f9fdc"/>
        <path d="M36 28.6c-3.4 0-4.9 2.3-4.9 4.6 0 2.7 1.1 6 2.4 7.3.9.9 1.8.3 2-1.2l.4-2.7
                 c.1-.7.3-.7.4 0l.4 2.7c.2 1.5 1.1 2.1 2 1.2 1.3-1.3 2.4-4.6 2.4-7.3
                 0-2.3-1.5-4.6-4.9-4.6z" fill="url(#lgtooth)"/>
      </svg>
    </div>
    <div><b>DentalDX</b><span>Data Exchange Analyzer</span></div>
  </div>
  <div class="ver">v{{ version }} · หน้าเว็บ {{ build }}</div>

  <label>กลุ่มอายุ</label>
  <select id="selProfile"></select>

  <label>จังหวัด</label>
  <select id="selPv"><option value="">— ทั้งหมด —</option></select>

  <label>อำเภอ</label>
  <select id="selAmp"><option value="">— ทั้งหมด —</option></select>

  <label>หน่วยบริการ</label>
  <select id="selHos"><option value="">— ทั้งหมด —</option></select>

  <button id="btnRefresh">↻ โหลดข้อมูลใหม่</button>

  <div class="hint">
    วางไฟล์ข้อมูล (.xlsx) ไว้ใน<br><code>data/&lt;กลุ่มอายุ&gt;/</code><br>
    แล้วกด "โหลดข้อมูลใหม่"<br><br>
    แก้เงื่อนไขการคำนวณได้ที่<br><code>profiles/*.yaml</code>
  </div>
</aside>

<main>
  <h1 id="title">สรุปผลการสำรวจสภาวะช่องปาก</h1>
  <div class="sub"><span id="scope">กำลังโหลด…</span><span id="topExport"></span></div>
  <div id="cards" class="cards"></div>
  <div id="body"><div class="msg">กำลังโหลดข้อมูล…</div></div>
</main>
</div>

<!-- ป๊อปอัพรายชื่อเด็กที่ยังไม่ได้ตรวจฟัน -->
<div id="modal" class="modal" hidden>
  <div class="sheet">
    <header>
      <div>
        <b id="mTitle">เด็กที่ยังไม่ได้ตรวจฟัน</b>
        <span id="mSub"></span>
      </div>

    </header>
    <div class="bar">
      <input id="mSearch" type="search" placeholder="ค้นหา ชื่อ / PID / บ้านเลขที่ / ตำบล…">

        ฟิลด์ต้นฉบับ</label>
      <label class="chk"><input type="checkbox" id="mCalc" checked>
        ค่าที่ระบบคำนวณ</label>
      <a id="mCsv" class="dl">⬇ CSV</a>

<!-- ป๊อปอัพกราฟขนาดใหญ่ (คลิกจากตารางการกระจายของค่าตัวเลข) -->
<div id="zmodal" class="modal" hidden>
  <div class="sheet zsheet">
    <header>
      <div>
        <b id="zTitle"></b>
        <span id="zSub"></span>
      </div>
      <button id="zClose" class="x" title="ปิด">✕</button>
    </header>
    <div id="zBody" class="zbody"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let AREAS = {}, CURRENT = null;
const PAGE_BUILD = "{{ build }}";

// เตือนถ้าหน้าเว็บที่เปิดอยู่เก่ากว่าที่เซิร์ฟเวอร์มี (ติด cache)
(async () => {
  try {
    const v = await (await fetch('/api/version', {cache: 'no-store'})).json();
    if (v.build && PAGE_BUILD && v.build !== PAGE_BUILD) {
      const b = document.createElement('div');
      b.className = 'stale';
      b.innerHTML = `หน้านี้เป็นรุ่นเก่า (${PAGE_BUILD}) — เซิร์ฟเวอร์มีรุ่น ${v.build} ` +
        `<button onclick="location.replace('/?v=' + Date.now())">โหลดรุ่นล่าสุด</button>`;
      document.body.prepend(b);
    }
  } catch (e) { /* ไม่เป็นไร */ }
})();

const fmt = (v, d) => v === null || v === undefined || v === '' ? '–'
  : (typeof v === 'number' ? v.toLocaleString('th-TH',
      {minimumFractionDigits: d ?? 0, maximumFractionDigits: d ?? 0}) : v);

async function api(path) {
  const r = await fetch(path);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---------- ตัวเลือกพื้นที่ ----------
function fillSel(sel, items, keep) {
  sel.innerHTML = '<option value="">— ทั้งหมด —</option>' +
    items.map(i => `<option value="${i.v}">${i.t}</option>`).join('');
  if (keep && items.some(i => i.v === keep)) sel.value = keep;
}

function refreshAreaSelects() {
  const pv = $('#selPv').value, amp = $('#selAmp').value;
  fillSel($('#selPv'), Object.keys(AREAS).sort().map(p => ({v: p, t: p})), pv);
  const amps = pv && AREAS[pv] ? Object.keys(AREAS[pv]).sort()
    : [...new Set(Object.values(AREAS).flatMap(o => Object.keys(o)))].sort();
  fillSel($('#selAmp'), amps.map(a => ({v: a, t: a})), amp);
  const a2 = $('#selAmp').value;
  let hos = [];
  for (const [p, o] of Object.entries(AREAS)) {
    if (pv && p !== pv) continue;
    for (const [a, list] of Object.entries(o)) {
      if (a2 && a !== a2) continue;
      hos.push(...list);
    }
  }
  hos.sort((x, y) => x.name.localeCompare(y.name, 'th'));
  fillSel($('#selHos'), hos.map(h => ({v: h.code, t: h.name})), $('#selHos').value);
}

// ---------- render ----------
function kpiCards(s) {
  const c = [
    ['เด็กในเขตรับผิดชอบ', fmt(s.target), 'คน', 'c-lav'],
    ['ได้รับการตรวจฟัน', fmt(s.examined), `คน (${fmt(s.examined_pct, 1)}%)`, 'c-teal'],
    ['ผ่านเกณฑ์คุณภาพ', fmt(s.qualified), `คน (${fmt(s.qualified_pct, 1)}%)`, 'c-indigo'],
    ['หน่วยบริการ', fmt(s.hospitals), `แห่ง / ${s.districts} อำเภอ`, 'c-sun'],
    ['ช่วงวันที่ตรวจ', s.date_min, `ถึง ${s.date_max}`, 'c-sky'],
  ];
  $('#cards').innerHTML = c.map(([k, v, u, cl]) =>
    `<div class="card ${cl}"><div class="k">${k}</div><div class="v">${v}</div>
     <div class="u">${u}</div></div>`).join('');
}

function isPct(col) { return col.includes('ร้อยละ'); }

// ---------- สำรวจข้อมูล (EDA) ----------
let EDA_CACHE = null, EDA_KEY = '', ZOOM = null;

function pctBar(pct, tone) {
  const w = Math.max(0, Math.min(100, pct || 0));
  return `<span class="pb"><i class="${tone || ''}" style="width:${w}%"></i></span>`;
}

function edaAnomalies(a) {
  const rows = a.rules.filter(r => r.count > 0);
  const clean = a.rules.length - rows.length;
  const body = rows.length ? rows.map(r => `<tr>
      <td>${esc(r.name)}<span class="hint2">${esc(r.desc)}</span></td>
      <td class="pct">${fmt(r.count)}</td>
      <td>${fmt(r.pct, 2)}%</td>
      <td class="barcell">${pctBar(Math.min(100, r.pct * 10), r.pct >= 1 ? 'low' : 'mid')}</td>
    </tr>`).join('')
    : '<tr><td colspan="4" style="text-align:center;color:var(--mint)">ไม่พบค่าผิดปกติ ✔</td></tr>';
  const tone = a.pct >= 5 ? 'bad' : a.pct >= 1 ? 'warn' : 'good';
  return `<section>
    <h2><span class="no">1</span> ค่าผิดปกติและข้อมูลขัดแย้งกันเอง</h2>
    <div class="insight"><ul class="ilist">
      <li class="t-${tone}"><b>${TONE_ICON[tone]}</b>พบแถวที่มีอย่างน้อย 1 ปัญหา
        ${fmt(a.rows_with_issue)} จาก ${fmt(a.rows_total)} แถว (${fmt(a.pct, 2)}%)${
        clean ? ` · ผ่านทุกเกณฑ์ ${clean} ข้อ` : ''}</li></ul></div>
    <div class="tw"><table><thead><tr>
      <th>ปัญหาที่ตรวจพบ</th><th>จำนวนแถว</th><th>ร้อยละ</th>
      <th style="width:140px"></th></tr></thead><tbody>${body}</tbody></table></div>
  </section>`;
}

function boxPlot(d) {
  const W = 300, H = 44, padL = 10, padR = 10;
  const lo = Math.min(d.min, d.whisker_lo), hi = Math.max(d.max, d.whisker_hi);
  const span = (hi - lo) || 1;
  const x = v => padL + (W - padL - padR) * (v - lo) / span;
  const cy = H / 2;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="box">
    <line x1="${x(d.whisker_lo)}" x2="${x(d.whisker_hi)}" y1="${cy}" y2="${cy}"
          stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="${x(d.whisker_lo)}" x2="${x(d.whisker_lo)}" y1="${cy - 8}" y2="${cy + 8}"
          stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="${x(d.whisker_hi)}" x2="${x(d.whisker_hi)}" y1="${cy - 8}" y2="${cy + 8}"
          stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="${x(d.q1)}" y="${cy - 10}" width="${Math.max(1.5, x(d.q3) - x(d.q1))}"
          height="20" rx="3" fill="#bfdbfe" stroke="#3b82f6"/>
    <line x1="${x(d.median)}" x2="${x(d.median)}" y1="${cy - 10}" y2="${cy + 10}"
          stroke="#1d4ed8" stroke-width="2.5"/>
    ${d.outliers_hi ? `<circle cx="${x(d.max)}" cy="${cy}" r="3.5" fill="#ef4444"/>` : ''}
    ${d.outliers_lo ? `<circle cx="${x(d.min)}" cy="${cy}" r="3.5" fill="#ef4444"/>` : ''}
    <title>min ${d.min} · Q1 ${d.q1} · median ${d.median} · Q3 ${d.q3} · max ${d.max}</title>
  </svg>`;
}

function miniHist(h) {
  const max = Math.max(...h.map(b => b.count), 1);
  return `<span class="spark">${h.map(b =>
    `<i style="height:${Math.max(3, Math.round(100 * b.count / max))}%"
        title="${b.from}–${b.to} : ${b.count.toLocaleString('th-TH')}"></i>`).join('')}</span>`;
}

function edaNumeric(list) {
  if (!list.length) return '';
  const body = list.map((d, i) => `<tr class="zoomrow" data-zoom="${i}"
      title="คลิกเพื่อดูกราฟขนาดใหญ่">
      <td>${esc(d.label)}<span class="hint2">${esc(d.column)}</span></td>
      <td>${fmt(d.median, 1)}</td>
      <td>${fmt(d.mean, 2)} <span class="hint3">±${fmt(d.sd, 2)}</span></td>
      <td class="${d.min < 0 ? 'warnval' : ''}">${fmt(d.min, 0)}–${fmt(d.max, 0)}</td>
      <td class="${d.outlier_pct >= 5 ? 'warnval' : ''}">${fmt(d.outlier_pct, 1)}%</td>
      <td>${fmt(d.zero_pct, 1)}%</td>
      <td class="boxcell">${boxPlot(d)}</td>
      <td class="histcell">${miniHist(d.hist)}</td>
      <td class="zoomcell"><span class="zbtn">🔍 ขยาย</span></td></tr>`).join('');
  return `<section>
    <h2><span class="no">2</span> การกระจายของค่าตัวเลข</h2>
    <div class="cond">
      <div>• คิดเฉพาะแถวที่ตรวจฟันและอยู่ในช่วงอายุของกลุ่มนี้</div>
      <div>• กล่องฟ้า = ช่วง Q1–Q3 (ครึ่งกลางของข้อมูล) · เส้นเข้ม = มัธยฐาน ·
        จุดแดง = มีค่าเกินหนวด 1.5 × IQR</div>
      <div>• <b>คลิกที่แถวใดก็ได้เพื่อเปิดกราฟขนาดใหญ่</b></div>
    </div>
    <div class="tw"><table><thead><tr>
      <th>ตัวแปร</th><th>มัธยฐาน</th><th>เฉลี่ย ± SD</th><th>ต่ำสุด–สูงสุด</th>
      <th>%outlier</th><th>%เป็นศูนย์</th><th>Boxplot</th>
      <th>Histogram</th><th></th></tr></thead><tbody>${body}</tbody></table></div>
  </section>`;
}

// ---------- กราฟขนาดใหญ่ (คลิกจากตารางการกระจายของค่าตัวเลข) ----------
// histogram กับ boxplot ใช้แกน X ร่วมกัน จึงอ่านคู่กันได้ว่ายอดไหนอยู่ในกล่อง Q1-Q3
function bigChart(d) {
  const W = 900, HH = 300, BH = 110, padL = 62, padR = 26, padT = 18;
  const lo = Math.min(d.min, d.whisker_lo, d.hist[0].from);
  const hi = Math.max(d.max, d.whisker_hi, d.hist[d.hist.length - 1].to);
  const span = (hi - lo) || 1;
  const x = v => padL + (W - padL - padR) * (v - lo) / span;
  const maxC = Math.max(...d.hist.map(b => b.count), 1);
  const y = c => padT + (HH - padT - 34) * (1 - c / maxC);
  const base = HH - 34;

  // แกน Y ของฮิสโทแกรม 4 ขีด
  const yticks = [0, .25, .5, .75, 1].map(t => {
    const c = maxC * t, yy = y(c);
    return `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="#e8eef4"/>
      <text x="${padL - 8}" y="${yy + 4}" text-anchor="end" class="ax">${
        Math.round(c).toLocaleString('th-TH')}</text>`;
  }).join('');

  const bars = d.hist.map((b, bi) => {
    const x0 = x(b.from), x1 = x(b.to);
    const w = Math.max(2, x1 - x0 - 3), h = base - y(b.count);
    // แท่งกราฟคลิกได้เหมือนการ์ด -> ดูรายชื่อเด็กที่มีค่าอยู่ในช่วงของแท่งนั้น
    const on = b.count > 0;
    const last = bi === d.hist.length - 1;
    return `<g${on ? ` class="clkbar" data-sel="range" data-col="${esc(d.column)}"
        data-lo="${b.from}" data-hi="${b.to}"${last ? '' : ' data-hix="1"'}` : ''}>
      <rect x="${x0 + 1.5}" y="${y(b.count)}" width="${w}" height="${Math.max(0, h)}"
        rx="3" fill="#7cb8ea"><title>${b.from}–${b.to} : ${
        b.count.toLocaleString('th-TH')} คน${on ? ' (คลิกเพื่อดูรายบุคคล)' : ''}</title></rect>${
      b.count && h > 16 ? `<text x="${x0 + 1.5 + w / 2}" y="${y(b.count) - 5}"
        text-anchor="middle" class="vl">${b.count.toLocaleString('th-TH')}</text>` : ''}</g>`;
  }).join('');

  // แกน X ร่วม 6 ขีด
  const xticks = Array.from({length: 6}, (_, i) => {
    const v = lo + span * i / 5, xx = x(v);
    return `<line x1="${xx}" x2="${xx}" y1="${base}" y2="${base + 5}" stroke="#94a3b8"/>
      <text x="${xx}" y="${base + 19}" text-anchor="middle" class="ax">${
        (Math.round(v * 10) / 10).toLocaleString('th-TH')}</text>`;
  }).join('');

  const cy = BH / 2 - 6;
  const lab = (v, txt, dy) => `<text x="${x(v)}" y="${cy + dy}" text-anchor="middle"
      class="bl">${txt} ${(Math.round(v * 100) / 100).toLocaleString('th-TH')}</text>`;
  const boxSvg = `<svg viewBox="0 0 ${W} ${BH}" class="bigbox">
    <line x1="${x(d.whisker_lo)}" x2="${x(d.whisker_hi)}" y1="${cy}" y2="${cy}"
      stroke="#7c8ea0" stroke-width="2"/>
    ${[d.whisker_lo, d.whisker_hi].map(v =>
      `<line x1="${x(v)}" x2="${x(v)}" y1="${cy - 16}" y2="${cy + 16}"
        stroke="#7c8ea0" stroke-width="2"/>`).join('')}
    <rect x="${x(d.q1)}" y="${cy - 22}" width="${Math.max(2, x(d.q3) - x(d.q1))}" height="44"
      rx="5" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
    <line x1="${x(d.median)}" x2="${x(d.median)}" y1="${cy - 22}" y2="${cy + 22}"
      stroke="#1d4ed8" stroke-width="3"/>
    ${d.outliers_lo ? `<circle cx="${x(d.min)}" cy="${cy}" r="5" fill="#ef4444"/>` : ''}
    ${d.outliers_hi ? `<circle cx="${x(d.max)}" cy="${cy}" r="5" fill="#ef4444"/>` : ''}
    ${lab(d.q1, 'Q1', -30)}${lab(d.median, 'มัธยฐาน', 40)}${lab(d.q3, 'Q3', -30)}
    ${d.outliers_hi ? `<text x="${x(d.max)}" y="${cy + 40}" text-anchor="middle"
      class="bl red">outlier ${d.outliers_hi.toLocaleString('th-TH')} ค่า</text>` : ''}
    ${d.outliers_lo ? `<text x="${x(d.min)}" y="${cy - 30}" text-anchor="middle"
      class="bl red">outlier ${d.outliers_lo.toLocaleString('th-TH')} ค่า</text>` : ''}
  </svg>`;

  // การ์ดที่มี sel = คลิกได้ -> เปิดรายชื่อเด็กที่อยู่เบื้องหลังตัวเลขนั้น
  const stat = (k, v, o) => {
    o = o || {};
    const n = o.n;
    const on = o.sel && n > 0;
    return `<div class="st ${o.cls || ''} ${on ? 'clk' : ''}"
      ${on ? `data-sel="${o.sel}" data-col="${esc(d.column)}"
        title="คลิกเพื่อดูรายชื่อเด็ก ${fmt(n)} ราย"` : ''}>
      <b>${v}</b><span>${k}</span>${
      on ? `<em>▸ ดูรายบุคคล ${fmt(n)} ราย</em>` : ''}</div>`;
  };
  return `<div class="zstats">
      ${stat('จำนวนที่มีค่า', fmt(d.n), {sel: 'all', n: d.n})}
      ${stat('มัธยฐาน', fmt(d.median, 2))}
      ${stat('เฉลี่ย ± SD', fmt(d.mean, 2) + ' ± ' + fmt(d.sd, 2))}
      ${stat('Q1 – Q3', fmt(d.q1, 2) + ' – ' + fmt(d.q3, 2), {sel: 'iqr', n: d.iqr_n})}
      ${stat('ต่ำสุด – สูงสุด', fmt(d.min, 0) + ' – ' + fmt(d.max, 0),
             {sel: 'extreme', n: d.extreme_n, cls: d.min < 0 ? 'bad' : ''})}
      ${stat('%outlier', fmt(d.outlier_pct, 1) + '%',
             {sel: 'outlier', n: d.outlier_n, cls: d.outlier_pct >= 5 ? 'bad' : ''})}
      ${stat('%เป็นศูนย์', fmt(d.zero_pct, 1) + '%',
             {sel: 'zero', n: d.zero_n, cls: d.zero_pct >= 50 ? 'bad' : ''})}
      ${d.neg_n ? stat('ค่าติดลบ', fmt(d.neg_n), {sel: 'neg', n: d.neg_n, cls: 'bad'}) : ''}
    </div>
    <div class="ztitle">การกระจายความถี่ (Histogram) — แกนตั้งคือจำนวนคน
      <span class="zclick">คลิกที่แท่งเพื่อดูรายชื่อเด็กในช่วงนั้น</span></div>
    <svg viewBox="0 0 ${W} ${HH}" class="bighist">
      ${yticks}<line x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"
        stroke="#94a3b8"/>${bars}${xticks}</svg>
    <div class="ztitle">Boxplot — แกนนอนเดียวกับกราฟบน</div>
    ${boxSvg}
    <div class="zhelp">กล่องฟ้า = ครึ่งกลางของข้อมูล (Q1–Q3) · เส้นน้ำเงินเข้ม = มัธยฐาน ·
      ปลายหนวด = ค่าสุดท้ายที่ยังอยู่ในช่วง 1.5 × IQR · จุดแดง = ค่าที่หลุดออกไป (outlier)</div>`;
}

function openZoom(i) {
  const d = (EDA_CACHE && EDA_CACHE.numeric || [])[i];
  if (!d) return;
  ZOOM = d;
  $('#zTitle').textContent = d.label;
  $('#zSub').textContent = `คอลัมน์ ${d.column} · จากข้อมูล ${fmt(d.n)} แถวในขอบเขตที่เลือก`;
  $('#zBody').innerHTML = bigChart(d);
  $('#zmodal').hidden = false;
}

// คลิกการ์ดสถิติ หรือแท่งกราฟ -> เปิดรายชื่อเด็กที่อยู่เบื้องหลังตัวเลขนั้น
$('#zBody').addEventListener('click', e => {
  const el = e.target.closest('[data-sel]');
  if (!el) return;
  openPending({kind: 'value', col: el.dataset.col, sel: el.dataset.sel,
               lo: el.dataset.lo, hi: el.dataset.hi, hix: el.dataset.hix},
              (ZOOM && ZOOM.label) || el.dataset.col);
});

function edaCategorical(list) {
  if (!list.length) return '';
  const cards = list.map(c => `<div class="ccard">
    <div class="chead"><b>${esc(c.label)}</b> <span>${esc(c.column)}</span>
      <em>${c.distinct} ค่า · ว่าง ${fmt(c.missing_pct, 1)}%</em></div>
    <table><tbody>${c.items.map(i => `<tr>
      <td class="cv">${esc(i.value)}</td>
      <td class="cl">${esc(i.label)}</td>
      <td class="cn">${fmt(i.count)}</td>
      <td class="cp">${fmt(i.pct, 1)}%</td>
      <td class="barcell">${pctBar(i.pct, 'mid')}</td></tr>`).join('')}</tbody></table>
  </div>`).join('');
  return `<section>
    <h2><span class="no">3</span> ความถี่ของตัวแปรหมวดหมู่</h2>
    <div class="cond"><div>• คำอธิบายรหัสดึงจาก reference/dentalfile.csv อัตโนมัติ</div></div>
    <div class="cgrid">${cards}</div>
  </section>`;
}

function edaHeatmap(h) {
  if (!h.metrics || !h.metrics.length) return '';
  const unitName = h.level === 'unit' ? 'หน่วยบริการ' : 'อำเภอ';
  const color = s => s === null || s === undefined
    ? 'background:#f6f8fa;color:var(--muted)'
    : `background:rgba(${Math.round(239 - 175 * s)},${Math.round(68 + 120 * s)},` +
      `${Math.round(68 + 70 * s)},${(0.18 + 0.62 * s).toFixed(2)});` +
      `color:${s > 0.55 ? '#14532d' : '#7f1d1d'}`;
  const body = h.rows.map(r => `<tr>
      <td>${r.code ? `<span class="code">${esc(r.code)}</span> ` : ''}${esc(r.name)}</td>
      ${r.cells.map(c => `<td class="hm" style="${color(c.score)}">${
        typeof c.value === 'number' ? fmt(c.value, 2) : '–'}</td>`).join('')}
    </tr>`).join('');
  return `<section>
    <h2><span class="no">4</span> Heatmap เปรียบเทียบราย${unitName}</h2>
    <div class="cond">
      <div>• เขียว = ดีที่สุดในกลุ่ม · แดง = ด้อยที่สุดในกลุ่ม (เทียบกันเองในหน้านี้ ไม่ใช่เกณฑ์มาตรฐาน)</div>
      <div>• ช่วงค่า: ${h.metrics.map(m => `${esc(m.label)} ${m.min}–${m.max}`).join(' · ')}</div>
    </div>
    <div class="tw"><table><thead><tr><th>${unitName}</th>
      ${h.metrics.map(m => `<th>${esc(m.label)}</th>`).join('')}</tr></thead>
      <tbody>${body}</tbody></table></div>
  </section>`;
}

function renderEda(e) {
  return `<div class="cond" style="margin:0 0 14px 2px">
      สำรวจจาก ${fmt(e.n_pop)} แถวในขอบเขตที่เลือก
      (ตรวจฟันและอยู่ในช่วงอายุ ${fmt(e.n_scoped)} แถว)</div>` +
    edaAnomalies(e.anomalies) + edaNumeric(e.numeric) +
    edaCategorical(e.categorical) + edaHeatmap(e.heatmap);
}

async function loadEda() {
  const pane = $('#body').querySelector('.pane[data-tab=eda]');
  if (!pane) return;
  const q = new URLSearchParams({profile: $('#selProfile').value, pv: $('#selPv').value,
    amp: $('#selAmp').value, hos: $('#selHos').value});
  const key = q.toString();
  if (EDA_KEY === key && EDA_CACHE) { pane.innerHTML = renderEda(EDA_CACHE); return; }
  pane.innerHTML = '<div class="msg">กำลังสำรวจข้อมูล…</div>';
  try {
    const e = await api('/api/eda?' + q);
    EDA_CACHE = e; EDA_KEY = key;
    pane.innerHTML = renderEda(e);
  } catch (err) {
    pane.innerHTML = `<section><div class="err">${esc(err.message)}</div></section>`;
  }
}

// ---------- แท็บถาม-ตอบ ----------
let ASK_STATUS = null, ASK_LOG = [];

const ASK_SAMPLES = ['caries free ของอายุ 3 ขวบ', 'ปราศจากฟันผุ 3-5 ปี รายอำเภอ',
  'ฟันผุไม่ได้รักษา อายุ 5 ปี', 'ค่าเฉลี่ยฟันผุถอนอุด อายุ 4 ปี',
  'อำเภอไหนปราศจากฟันผุน้อยที่สุด'];

function askScopeText(s) {
  if (!s) return 'ทั้งหมด';
  if (s.hos) return s.hos_name || s.hos;
  if (s.amp) return 'อำเภอ' + s.amp;
  if (s.pv) return 'จังหวัด' + s.pv;
  return 'ทุกพื้นที่ในข้อมูล';
}

function renderAnswer(a) {
  const r = a.result, t = r.total;
  const isMean = t.kind === 'mean';
  const groups = (r.groups || []).map((g, i) =>
    `<tr><td>${i + 1}</td><td>${esc(g.name)}</td>
      <td class="num pct2">${fmt(isMean ? g.mean : g.pct, 2)}${isMean ? '' : '%'}</td>
      <td class="num">${fmt(isMean ? g.sum : g.count)}</td>
      <td class="num">${fmt(g.base)}</td></tr>`).join('');
  const tag = a.planner === 'ai'
    ? '<span class="aitag">AI</span>'
    : '<span class="aitag rules">คีย์เวิร์ด</span>';
  return `<div class="answer">
    <div class="q">❓ ${esc(a.question)}${tag}</div>
    <div class="txt">${esc(a.text)}</div>
    ${groups ? `<div class="tw" style="margin-top:12px"><table><thead><tr>
        <th>#</th><th>${esc(r.group_by || 'พื้นที่')}</th>
        <th class="num">${isMean ? 'ค่าเฉลี่ย' : 'ร้อยละ'}</th>
        <th class="num">${isMean ? 'รวมซี่' : 'จำนวน'}</th><th class="num">ฐาน</th>
      </tr></thead><tbody>${groups}</tbody></table></div>` : ''}
    <div class="meta">
      <b>ที่มาของตัวเลข:</b> ${esc(r.profile.label)} ·
      ตารางที่ ${esc(r.table.no)} ${esc(r.table.title)} ·
      ตัวชี้วัด "${esc(r.metric)}" · แถว ${esc((r.rows || []).join(', '))} ·
      ขอบเขต ${esc(askScopeText(r.scope))}
      ${(r.conditions || []).length
        ? '<br><b>เงื่อนไข:</b> ' + r.conditions.map(esc).join(' · ') : ''}
      ${a.spec && a.spec._ai_error
        ? '<br><b>หมายเหตุ:</b> เรียก AI ไม่สำเร็จ จึงใช้ตัวแปลแบบคีย์เวิร์ดแทน'
        : ''}
      ${a.declined
        ? '<br><b>หมายเหตุ:</b> คุณไม่ได้ส่งตัวเลขให้ AI เรียบเรียง — ' +
          'ตัวเลขนี้คำนวณในเครื่องทั้งหมด'
        : ''}
    </div></div>`;
}

// ---------- กล่องยืนยันก่อนส่งข้อมูลออกนอกเครื่อง ----------
let ASK_PRETTY = false;

async function postJSON(url, body) {
  const res = await fetch(url, {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const d = await res.json();
  if (!res.ok || d.error) throw new Error(d.error || res.statusText);
  return d;
}

// จัดรูปแบบให้อ่านง่าย — ไม่ใช่รูปแบบที่ส่งจริง (ของจริงเขียนติดกันเพื่อประหยัด token)
function prettyBody(s) {
  if (!ASK_PRETTY) return s;
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return s; }
}

function renderConfirm(o, note) {
  return `<div class="confirm${o.local ? ' local' : ''}">
    <h4>${o.local ? '🖥 ส่งให้โมเดลในเครื่อง — ไม่ออกอินเทอร์เน็ต'
                  : '🔒 กำลังจะส่งข้อมูลนี้ออกไปนอกเครื่อง'}</h4>
    <dl>
      <dt>ปลายทาง</dt><dd>${esc(o.endpoint)}</dd>
      <dt>โมเดล</dt><dd>${esc(o.model || '-')}</dd>
      <dt>กุญแจ</dt><dd>${esc(o.api_key)}</dd>
      <dt>ขนาด</dt><dd>${fmt(o.bytes)} ไบต์</dd>
    </dl>
    ${note ? `<div class="lbl">${note}</div>` : ''}
    <div class="lbl">คำสั่งระบบ</div>
    <pre>${esc(o.system)}</pre>
    <div class="lbl">เนื้อหาที่ส่ง — ทั้งหมด ไม่ตัดทอน</div>
    <pre class="body">${esc(prettyBody(o.user))}</pre>
    <div class="acts">
      <button class="go">ยืนยันส่ง</button>
      <button class="no">ยกเลิก</button>
      <button class="fmt">${ASK_PRETTY ? 'ดูแบบที่ส่งจริง' : 'จัดให้อ่านง่าย'}</button>
    </div></div>`;
}

// คืน true เมื่อผู้ใช้กดยืนยัน — ก่อนหน้านั้นไม่มีอะไรถูกส่งออกไป
function askConfirm(o, note) {
  return new Promise(resolve => {
    const box = $('#body').querySelector('#askOut');
    box.insertAdjacentHTML('afterbegin', renderConfirm(o, note));
    const el = box.firstElementChild;
    el.querySelector('.go').onclick = () => { el.remove(); resolve(true); };
    el.querySelector('.no').onclick = () => { el.remove(); resolve(false); };
    el.querySelector('.fmt').onclick = ev => {
      ASK_PRETTY = !ASK_PRETTY;
      el.querySelector('pre.body').textContent = prettyBody(o.user);
      ev.target.textContent = ASK_PRETTY ? 'ดูแบบที่ส่งจริง' : 'จัดให้อ่านง่าย';
    };
    // เลื่อนให้เห็นกล่อง — ห้ามให้พังทั้งฟังก์ชันถ้าเบราว์เซอร์ไม่รองรับ
    try { el.scrollIntoView({block: 'nearest', behavior: 'smooth'}); } catch (e) {}
  });
}

async function runAsk(q) {
  q = String(q || '').trim();
  const pane = $('#body').querySelector('.pane[data-tab=ask]');
  if (!pane || !q) return;
  const box = pane.querySelector('#askOut');
  const btn = pane.querySelector('#askGo');
  btn.disabled = true;
  try {
    // จังหวะ 1 — ดูก่อนว่าจะส่งอะไรออกไป (ยังไม่ส่ง)
    const pv = await postJSON('/api/ask/preview', {q});
    let token = null;
    if (pv.outbound) {
      const ok = await askConfirm(pv.outbound,
        'AI จะเห็นแค่นี้: ชื่อกลุ่มอายุ ชื่อตาราง ชื่อตัวชี้วัด และคำถามของคุณ ' +
        '— ไม่มีข้อมูลเด็กและไม่มีตัวเลขผลลัพธ์');
      if (!ok) {
        ASK_LOG.unshift(`<div class="answer"><div class="q">❓ ${esc(q)}</div>
          <div class="txt">ยกเลิกแล้ว — ไม่มีข้อมูลถูกส่งออกไป</div></div>`);
        box.innerHTML = ASK_LOG.join('');
        return;
      }
      token = pv.token;
    }
    // จังหวะ 2 — แปลคำถาม (ถ้ายืนยัน) แล้วคำนวณในเครื่อง
    box.innerHTML = '<div class="msg">กำลังคิด…</div>' + ASK_LOG.join('');
    const a = await postJSON('/api/ask', token ? {token} : {q});
    // จังหวะ 3 — ก้อนที่มีตัวเลข ต้องยืนยันอีกครั้ง
    if (a.next) {
      box.innerHTML = ASK_LOG.join('');
      const ok2 = await askConfirm(a.next,
        '⚠ ก้อนนี้มี "ตัวเลขสรุป" อยู่ด้วย (ส่งไปให้ AI เรียบเรียงเป็นประโยค) ' +
        '— กดยกเลิกได้ คำตอบจะแสดงเป็นรูปแบบมาตรฐานแทน ตัวเลขเท่ากันทุกประการ');
      if (ok2) {
        const t = await postJSON('/api/ask/phrase', {token: a.next_token});
        if (t.text) { a.text = t.text; a.phrased = true; }
      } else {
        a.declined = true;
      }
    }
    ASK_LOG.unshift(renderAnswer(a));
  } catch (e) {
    ASK_LOG.unshift(`<div class="answer"><div class="q">❓ ${esc(q)}</div>
      <div class="err">${esc(e.message)}</div></div>`);
  }
  box.innerHTML = ASK_LOG.join('');
  btn.disabled = false;
}

// ---------- หน้าตั้งค่า AI ----------
let AI_CFG = null, AI_PROVIDERS = [], AI_MODELS = {models: [], live: false, error: ''};

function renderAiSettings() {
  const c = AI_CFG || {}, cur = c.provider || 'off';
  const modes = AI_PROVIDERS.map(p => `
    <label class="${p.id === cur ? 'on' : ''}">
      <input type="radio" name="aiprov" value="${esc(p.id)}"
             ${p.id === cur ? 'checked' : ''}>
      <span><b>${esc(p.label)}</b>${p.note ? esc(p.note) : ''}</span>
    </label>`).join('');

  const p = AI_PROVIDERS.find(x => x.id === cur) || {};
  const opts = AI_MODELS.models.map(m =>
    `<option value="${esc(m)}"${m === c.model ? ' selected' : ''}>${esc(m)}</option>`).join('');
  const custom = c.model && !AI_MODELS.models.includes(c.model)
    ? `<option value="${esc(c.model)}" selected>${esc(c.model)} (พิมพ์เอง)</option>` : '';

  const detail = cur === 'off' ? '' : `
    <div class="frm">
      <label for="aiModel">โมเดล</label>
      <div class="row">
        <select id="aiModel">${custom}${opts}</select>
        <button class="dl sm" id="aiModelRefresh" type="button">↻</button>
        <button class="dl sm" id="aiModelCustom" type="button">พิมพ์เอง</button>
      </div>
      ${AI_MODELS.error ? `<div class="hint" style="color:#b3261e">${esc(AI_MODELS.error)}</div>`
        : AI_MODELS.live ? '<div class="hint">อ่านจากเครื่องจริง — โมเดลที่ลงไว้แล้ว</div>'
        : '<div class="hint">เลือกจากรายการ หรือกด “พิมพ์เอง” ถ้าใช้โมเดลอื่น</div>'}

      ${p.needs_key ? `
      <label for="aiKey">API key</label>
      <input id="aiKey" type="password" autocomplete="off"
             placeholder="${c.has_key ? 'ตั้งไว้แล้ว: ' + esc(c.key_hint) + ' (เว้นว่าง = ไม่เปลี่ยน)'
                                      : 'วางกุญแจที่นี่'}">
      <div class="hint">เก็บลง <code>${esc(c.config_file || 'ai.yaml')}</code>
        ในเครื่องคุณ · ไฟล์นี้ถูกกันไม่ให้ commit ไว้แล้ว
        ${c.has_key ? '· <a href="#" id="aiClearKey">ลบกุญแจ</a>' : ''}
        ${c.key_from_env ? '<br>⚠ มี DENTALDX_AI_KEY ตั้งไว้ที่ environment ซึ่งจะทับค่าในไฟล์'
                         : ''}</div>` : ''}

      <label for="aiUrl">Base URL</label>
      <input id="aiUrl" value="${esc(c.base_url || '')}"
             placeholder="${cur === 'ollama' ? 'http://127.0.0.1:11434' : 'ปล่อยว่าง = ค่ามาตรฐาน'}">
      <div class="hint">ใช้เมื่อผ่าน proxy ของหน่วยงาน หรือ Ollama อยู่คนละเครื่อง</div>

      <label>ตัวเลือก</label>
      <div class="row" style="flex-wrap:wrap;gap:14px">
        <label class="chk"><input type="checkbox" id="aiConfirm"
          ${c.confirm !== false ? 'checked' : ''}> โชว์ข้อมูลที่จะส่งแล้วรอกดยืนยัน</label>
        <label class="chk"><input type="checkbox" id="aiPhrase"
          ${c.phrase !== false ? 'checked' : ''}> ให้ AI เรียบเรียงประโยคตอบ</label>
      </div>
      <div class="hint">ปิด “เรียบเรียงประโยค” แล้ว <b>ตัวเลขจะไม่ถูกส่งออกนอกเครื่องเลย</b>
        และประหยัดโควตาไปครึ่งหนึ่ง</div>
    </div>`;

  const warn = (cur === 'gemini' && c.phrase !== false)
    ? `<div class="warn">⚠ <b>Gemini free tier</b>: Google ระบุว่า prompt และคำตอบของบริการ
       ที่ไม่เสียเงินอาจถูกนำไปพัฒนาผลิตภัณฑ์ และอาจมีคนเข้ามาอ่าน<br>
       ถ้าใช้แบบฟรี แนะนำให้ <b>ปิด “ให้ AI เรียบเรียงประโยคตอบ”</b>
       เพื่อไม่ให้ตัวเลขออกจากเครื่อง หรือผูกบัญชีเป็น paid tier</div>` : '';

  return `<div class="aiset">
    <h3>⚙ ตั้งค่าการถาม-ตอบ</h3>
    <div class="modes">${modes}</div>
    ${warn}${detail}
    <div class="acts">
      <button class="save" id="aiSave">บันทึก</button>
      <button class="alt" id="aiTest">ทดสอบการเชื่อมต่อ</button>
      <button class="alt" id="aiClose">ปิด</button>

// ส่งกุญแจไปทาง POST (ไม่ใส่ใน URL) เผื่อผู้ใช้เพิ่งพิมพ์แต่ยังไม่ได้บันทึก
async function loadAiModels(provider, baseUrl, apiKey) {
  if (!provider || provider === 'off') { AI_MODELS = {models: [], live: false, error: ''}; return; }
  try {
    AI_MODELS = await postJSON('/api/ask/models',
      {provider, base_url: baseUrl || '', api_key: apiKey || ''});
  } catch (e) { AI_MODELS = {models: [], live: false, error: e.message}; }
}

function bindAiSettings() {
  const box = $('#body').querySelector('#aiSet');
  if (!box) return;
  const msg = box.querySelector('#aiMsg');
  const say = (txt, ok) => msg.innerHTML =
    `<div class="msg2 ${ok ? 'good' : 'bad'}">${esc(txt)}</div>`;

  // อ่านค่าที่ "อยู่บนหน้าจอตอนนี้" (อาจยังไม่ได้บันทึก)
  const formValues = () => {
    const g = id => box.querySelector('#' + id);
    const body = {provider: AI_CFG.provider};
    if (AI_CFG.provider !== 'off') {
      body.model = AI_CFG.model || '';
      body.base_url = g('aiUrl') ? g('aiUrl').value.trim() : '';
      body.confirm = g('aiConfirm') ? g('aiConfirm').checked : true;
      body.phrase = g('aiPhrase') ? g('aiPhrase').checked : true;
      if (g('aiKey') && g('aiKey').value.trim()) body.api_key = g('aiKey').value.trim();
    }
    return body;
  };

  // มีอะไรบนหน้าจอที่ยังไม่ได้บันทึกหรือเปล่า
  const isDirty = () => {
    const f = formValues(), c = AI_CFG || {};
    if (f.provider !== c.provider) return true;
    if (f.provider === 'off') return false;
    return (f.model || '') !== (c.model || '')
        || (f.base_url || '') !== (c.base_url || '')
        || f.confirm !== (c.confirm !== false)
        || f.phrase !== (c.phrase !== false)
        || !!f.api_key;
  };

  box.querySelectorAll('input[name=aiprov]').forEach(r => {
    r.onchange = async () => {
      AI_CFG = Object.assign({}, AI_CFG, {provider: r.value});
      const p = AI_PROVIDERS.find(x => x.id === r.value) || {};
      // เปลี่ยนผู้ให้บริการ -> โมเดลเดิมใช้ไม่ได้ ต้องเลือกใหม่
      const k0 = box.querySelector('#aiKey');
      await loadAiModels(r.value, AI_CFG.base_url, k0 ? k0.value : '');
      if (!AI_MODELS.models.includes(AI_CFG.model)) AI_CFG.model = AI_MODELS.models[0] || '';
      AI_CFG.needs_key = !!p.needs_key;
      box.innerHTML = renderAiSettings();
      bindAiSettings();
    };
  });

  // บอกให้เห็นว่ามีอะไรยังไม่ได้บันทึก (เดิมกดทดสอบแล้วงงว่าทำไมยังเป็นโหมดเก่า)
  const save = box.querySelector('#aiSave');
  const refreshDirty = () => {
    const d = isDirty();
    save.textContent = d ? 'บันทึก •' : 'บันทึก';
    save.title = d ? 'มีการแก้ไขที่ยังไม่ได้บันทึก' : '';
  };
  box.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('input', refreshDirty);
    el.addEventListener('change', refreshDirty);
  });

  const modelSel = box.querySelector('#aiModel');
  if (modelSel) modelSel.onchange = () => { AI_CFG.model = modelSel.value; refreshDirty(); };

  const refresh = box.querySelector('#aiModelRefresh');
  if (refresh) refresh.onclick = async () => {
    const url = box.querySelector('#aiUrl'), k = box.querySelector('#aiKey');
    refresh.disabled = true;
    say('กำลังดึงรายชื่อโมเดล…', true);
    await loadAiModels(AI_CFG.provider, url ? url.value : '', k ? k.value : '');
    // โมเดลที่เลือกไว้ไม่มีในรายการจริง = สาเหตุของ HTTP 404 ตอนใช้งาน
    const gone = AI_MODELS.live && AI_CFG.model && !AI_MODELS.models.includes(AI_CFG.model);
    const old = AI_CFG.model;
    if (gone) AI_CFG.model = AI_MODELS.models[0] || '';
    box.innerHTML = renderAiSettings(); bindAiSettings();
    const m = box.querySelector('#aiMsg');
    if (gone) {
      m.innerHTML = `<div class="msg2 bad">โมเดล “${esc(old)}” ไม่มีให้ใช้แล้ว —
        เปลี่ยนเป็น “${esc(AI_CFG.model)}” ให้แล้ว กด “บันทึก” เพื่อใช้ค่านี้</div>`;
    } else if (AI_MODELS.live) {
      m.innerHTML = `<div class="msg2 good">พบ ${AI_MODELS.models.length}
        โมเดลที่กุญแจนี้ใช้ได้</div>`;
    }
  };

  const custom = box.querySelector('#aiModelCustom');
  if (custom) custom.onclick = () => {
    const v = prompt('พิมพ์ชื่อโมเดล', AI_CFG.model || '');
    if (v && v.trim()) {
      AI_CFG.model = v.trim();
      box.innerHTML = renderAiSettings(); bindAiSettings();
    }
  };

  const clear = box.querySelector('#aiClearKey');
  if (clear) clear.onclick = async ev => {
    ev.preventDefault();
    try {
      const d = await postJSON('/api/ask/config', {clear_key: '1'});
      AI_CFG = d.config; ASK_STATUS = null;
      box.innerHTML = renderAiSettings(); bindAiSettings();
      say('ลบกุญแจแล้ว', true);
    } catch (e) { say(e.message, false); }
  };

  box.querySelector('#aiSave').onclick = async () => {
    const body = formValues();
    try {
      const d = await postJSON('/api/ask/config', body);
      AI_CFG = d.config; ASK_STATUS = null;
      // บันทึกกุญแจแล้ว ดึงรายชื่อโมเดลจริงได้ จะได้รู้ทันทีถ้าเลือกโมเดลที่ไม่มีแล้ว
      await loadAiModels(AI_CFG.provider, AI_CFG.base_url);
      await loadAsk();                       // วาดแท็บใหม่ให้สถานะตรง
      const b2 = $('#body').querySelector('#aiSet');
      if (b2) {
        b2.dataset.open = '1';
        markOpen('aiSetBtn', true);       // loadAsk วาดปุ่มใหม่ ต้องทำเครื่องหมายซ้ำ
        b2.innerHTML = renderAiSettings(); bindAiSettings();
        const bad = AI_CFG.enabled && AI_MODELS.live && AI_CFG.model
                    && !AI_MODELS.models.includes(AI_CFG.model);
        b2.querySelector('#aiMsg').innerHTML = bad
          ? `<div class="msg2 bad">บันทึกแล้ว แต่ปลายทางไม่มีโมเดล
             “${esc(AI_CFG.model)}” — เลือกจากรายการที่ดึงมาใหม่แล้วบันทึกอีกครั้ง</div>`
          : `<div class="msg2 good">บันทึกแล้ว — ${AI_CFG.enabled
            ? 'ใช้ ' + esc(AI_CFG.provider) + ' / ' + esc(AI_CFG.model || '')
            : (AI_CFG.needs_key && !AI_CFG.has_key
               ? 'เลือก ' + esc(AI_CFG.provider) + ' ไว้แล้ว แต่ยังไม่ได้ใส่ API key จึงยังใช้โหมดคีย์เวิร์ดอยู่'
               : 'โหมดไม่ใช้ AI — ไม่มีข้อมูลออกจากเครื่อง')}</div>`;
      }
    } catch (e) { say(e.message, false); }
  };

  box.querySelector('#aiTest').onclick = async () => {
    const dirty = isDirty();
    say('กำลังทดสอบ…', true);
    try {
      // ส่งค่าที่อยู่บนหน้าจอไปทดสอบ ไม่ใช่ค่าที่บันทึกไว้ (และไม่บันทึกให้ด้วย)
      const d = await postJSON('/api/ask/test', formValues());
      const where = d.provider ? ` (${esc(d.provider)} / ${esc(d.model || '')})` : '';
      let txt = (d.ok ? '✓ ' : '✕ ') + esc(d.text) + where;
      if (dirty) {
        txt += d.ok ? ' — ค่านี้ยังไม่ได้บันทึก อย่าลืมกด “บันทึก”'
                    : ' — ทดสอบจากค่าที่กรอกบนหน้าจอ (ยังไม่ได้บันทึก)';
      }
      msg.innerHTML = `<div class="msg2 ${d.ok ? 'good' : 'bad'}">${txt}</div>`;
    } catch (e) { say(e.message, false); }
  };

  box.querySelector('#aiClose').onclick = () => {
    box.innerHTML = ''; box.dataset.open = '0'; markOpen('aiSetBtn', false);
  };
}

// ปุ่มต้องบอกได้ว่าแผงเปิดอยู่หรือปิดอยู่
function markOpen(btnId, open) {
  const b = $('#body').querySelector('#' + btnId);
  if (b) b.classList.toggle('on', !!open);
}

async function toggleAiSettings() {
  const box = $('#body').querySelector('#aiSet');
  if (!box) return;
  if (box.dataset.open === '1') {
    box.innerHTML = ''; box.dataset.open = '0'; markOpen('aiSetBtn', false);
    return;
  }
  box.dataset.open = '1';
  markOpen('aiSetBtn', true);
  box.innerHTML = '<div class="msg">กำลังอ่านค่าตั้ง…</div>';
  try {
    const d = await api('/api/ask/config');
    AI_CFG = d.config; AI_PROVIDERS = d.providers;
    await loadAiModels(AI_CFG.provider, AI_CFG.base_url);
    box.innerHTML = renderAiSettings();
    bindAiSettings();
  } catch (e) {
    box.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// ---------- ประวัติสิ่งที่ส่งออกไปแล้วจริง ๆ ----------
async function showOutbox() {
  const el = $('#body').querySelector('#outbox');
  if (!el) return;
  if (el.dataset.open === '1') {
    el.innerHTML = ''; el.dataset.open = '0'; markOpen('outboxBtn', false);
    return;
  }
  el.dataset.open = '1';
  markOpen('outboxBtn', true);
  el.innerHTML = '<div class="msg">กำลังอ่าน…</div>';
  try {
    const d = await api('/api/ask/outbox');
    if (!d.sent.length) {
      el.innerHTML = '<div class="cond">ยังไม่มีอะไรถูกส่งออกไปในรอบนี้</div>';
      return;
    }
    el.innerHTML = `<div class="tw"><table class="outbox"><thead><tr>
      <th>เวลา</th><th>ขั้นตอน</th><th>ปลายทาง</th>
      <th class="num">ไบต์</th><th class="num">ms</th><th>ผล</th>
      </tr></thead><tbody>${d.sent.map(e => `<tr>
        <td>${esc(e.time)}</td><td>${esc(e.step)}</td>
        <td>${esc(e.local ? 'ในเครื่อง' : e.endpoint)}</td>
        <td class="num">${fmt(e.bytes)}</td><td class="num">${fmt(e.ms)}</td>
        <td>${e.ok ? '✓' : '✕ ' + esc(e.error || '')}</td></tr>`).join('')}
      </tbody></table></div>`;
  } catch (e) {
    el.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function renderAskPane() {
  const s = ASK_STATUS || {};
  let hint;
  if (!s.enabled) {
    hint = '🔒 ยังไม่ได้ตั้งค่า AI — ใช้ตัวแปลคำถามแบบคีย์เวิร์ดในเครื่อง ' +
      '<b>ไม่มีข้อมูลออกจากเครื่องเลย</b> (ถามสั้น ๆ ตรง ๆ เช่น "ปราศจากฟันผุ 3 ปี") · ' +
      'วิธีเปิดใช้ AI ดู docs/ถาม-ตอบด้วย-AI.md';
  } else {
    hint = `เชื่อมกับ <b>${esc(s.provider)}</b> (${esc(s.model || '')}) · ` +
      (s.confirm ? '<b>จะแสดงข้อมูลที่จะส่งให้ตรวจก่อนทุกครั้ง</b> แล้วรอกดยืนยัน'
                 : '⚠ ปิดการยืนยันไว้ (confirm: false) — ส่งทันทีโดยไม่ถาม') +
      (s.phrase ? '' : ' · phrase: false → ตัวเลขไม่ถูกส่งออก');
  }
  return `<section>
    <h2>💬 ถาม-ตอบ</h2>
    <div class="cond" style="margin:0 0 12px 2px">${hint}</div>
    <div class="askbar">
      <input id="askQ" placeholder="เช่น  caries free ของอายุ 3 ขวบ" autocomplete="off">
      <button id="askGo">ถาม</button>
    </div>
    <div class="chips">${ASK_SAMPLES.map(s2 =>
      `<button data-q="${esc(s2)}">${esc(s2)}</button>`).join('')}</div>
    <div style="margin:0 0 12px 2px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="dl" id="aiSetBtn" type="button">⚙ ตั้งค่า AI</button>
      <button class="dl" id="outboxBtn" type="button">📤 ประวัติสิ่งที่ส่งออกไปแล้ว</button>
    </div>
    <div id="aiSet" data-open="0"></div>
    <div id="outbox" data-open="0"></div>
    <div id="askOut">${ASK_LOG.join('')}</div>
  </section>`;
}

async function loadAsk() {
  const pane = $('#body').querySelector('.pane[data-tab=ask]');
  if (!pane) return;
  if (!ASK_STATUS) {
    try { ASK_STATUS = await api('/api/ask/status'); }
    catch { ASK_STATUS = {enabled: false}; }
  }
  pane.innerHTML = renderAskPane();
  const input = pane.querySelector('#askQ');
  pane.querySelector('#askGo').onclick = () => runAsk(input.value);
  input.onkeydown = ev => { if (ev.key === 'Enter') runAsk(input.value); };
  pane.querySelectorAll('.chips button').forEach(b => {
    b.onclick = () => { input.value = b.dataset.q; runAsk(b.dataset.q); };
  });
  pane.querySelector('#outboxBtn').onclick = showOutbox;
  pane.querySelector('#aiSetBtn').onclick = toggleAiSettings;
  input.focus();
}

// ---------- แท็บรายงาน ----------
let ACTIVE_TAB = 'overview';

function shortTitle(s) {
  const t = String(s || '').replace(/\s*\(.*?\)\s*$/, '');
  return t.length > 26 ? t.slice(0, 25) + '…' : t;
}

function selectTab(id) {
  ACTIVE_TAB = id;
  $('#body').querySelectorAll('.pane').forEach(p => {
    p.hidden = p.dataset.tab !== id;
  });
  $('#body').querySelectorAll('button.tab').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === id);
  });
  if (id === 'eda') loadEda();      // คำนวณตอนเปิดแท็บครั้งแรกเท่านั้น
  if (id === 'ask') loadAsk();
}

// ปุ่มส่งออกของแต่ละตาราง (which = 'overview' | เลขตาราง | 'all')
function exportBtns(which) {
  const q = new URLSearchParams({profile: $('#selProfile').value,
    pv: $('#selPv').value, amp: $('#selAmp').value, hos: $('#selHos').value,
    table: which});
  return `<span class="xp">
    <a class="dl sm" href="/api/table.csv?${q}" title="ส่งออกเป็น CSV">⬇ CSV</a>
    <a class="dl sm primary" href="/api/table.xlsx?${q}" title="ส่งออกเป็น Excel">⬇ Excel</a>
  </span>`;
}

function renderTable(t) {
  // จัดหัวตารางแบบ 2 ชั้นถ้าคอลัมน์เป็นรูปแบบ "metric|จำนวน"
  const cols = t.columns.filter(c => !c.includes('|รวมซี่'));
  const rowLabel = t.row_label || 'อายุ (ปี)';
  const grouped = cols.some(c => c.includes('|'));
  let thead;
  if (grouped) {
    const groups = [];
    cols.forEach(c => {
      const [g, s] = c.includes('|') ? c.split('|') : [c, null];
      const last = groups[groups.length - 1];
      if (last && last.g === g && s) last.subs.push({c, s});
      else groups.push({g, subs: s ? [{c, s}] : []});
    });
    thead = '<tr>' + groups.map(g => g.subs.length
      ? `<th class="grp" colspan="${g.subs.length}">${g.g}</th>`
      : `<th rowspan="2">${g.g === 'row' ? rowLabel : g.g}</th>`).join('') + '</tr><tr>' +
      groups.flatMap(g => g.subs.map(s => `<th>${s.s}</th>`)).join('') + '</tr>';
  } else {
    thead = '<tr>' + cols.map(c =>
      `<th>${c === 'row' ? rowLabel : c}</th>`).join('') + '</tr>';
  }

  // ช่องที่เป็น "ปัญหา" (followup ใน profile) คลิกดูรายชื่อเด็กที่ต้องตามต่อได้
  const followup = new Set(t.followup || []);
  const metricOf = c => c.includes('|') ? c.split('|')[0] : c;

  const tbody = t.rows.map(r => {
    const tot = r.row === 'รวม';
    return `<tr class="${tot ? 'total' : ''}${r._sub ? ' subrow' : ''}">` + cols.map(c => {
      const v = r[c];
      const d = isPct(c) || (t.kind === 'mean' && c !== 'row' && c !== 'ฐาน') ? 2 : 0;
      const met = metricOf(c);
      const on = followup.has(met) && v !== null && v !== undefined && v !== 0
                 && c !== 'row' && c !== 'ฐาน';
      const cls = (isPct(c) ? 'pct ' : '') + (on ? 'drill' : '');
      const attr = on ? ` data-tno="${esc(t.no)}" data-met="${esc(met)}"` +
                        ` data-row="${esc(r.row)}" title="คลิกดูรายชื่อเด็ก"` : '';
      const txt = (c === 'row' && r._sub) ? `↳ ${fmt(v, 0)} ปี` : fmt(v, c === 'row' ? 0 : d);
      return `<td class="${cls.trim()}"${attr}>${txt}</td>`;
    }).join('') + '</tr>';
  }).join('');

  const chart = tableChart(t);
  const ins = insightBlock(t);
  return `<section>
    <h2><span class="no">ตารางที่ ${t.no}</span> ${t.title}
      ${ins ? `<button class="mini insbtn on" data-toggle="ins">✕ ซ่อนสรุป</button>` : ''}
      ${chart ? `<button class="mini chartbtn on" data-toggle="chart">✕ ซ่อนกราฟ</button>` : ''}
      ${exportBtns(t.no)}</h2>
    <div class="cond">${(t.conditions || []).map(c => `<div>• ${c}</div>`).join('')}
      ${(t.followup || []).length ? '<div>• <b>ตัวเลขที่ขีดเส้นใต้คลิกได้</b> — ' +
        'เปิดรายชื่อเด็กที่ต้องตามต่อ พร้อมสรุปสิ่งที่ต้องทำ และส่งออก Excel ได้</div>' : ''}</div>
    ${ins}${chart}
    <div class="tw"><table><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>
  </section>`;
}

// ---------- กราฟแท่งคู่ (SVG) ----------
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

// สีทึบล้วน ไม่ใช้ gradient — อ่านง่ายกว่าและพิมพ์ออกมาไม่เพี้ยน
const PALETTE = [
  {c: '#2f9fdc', ink: '#0369a1'},
  {c: '#14b8a6', ink: '#0f766e'},
  {c: '#6366f1', ink: '#4338ca'},
  {c: '#f59e0b', ink: '#b45309'},
  {c: '#ef4444', ink: '#be123c'},
  {c: '#a855f7', ink: '#6d28d9'},
];

let CHART_SEQ = 0;

function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v / p * 2) / 2 * p;   // ปัดขึ้นเป็นครึ่งหลัก เช่น 0.61 -> 0.65
}

function groupedBarChart(rows, series, opt) {
  const o = Object.assign({h: 300, padL: 46, padR: 12, padT: 18, padB: 92,
                           slotMin: 62, max: null, suffix: '', dec: null}, opt || {});
  const n = rows.length;
  if (!n || !series.length) return '';

  let max = o.max;
  if (max === null) {
    const all = rows.flatMap(r => series.map(s => r[s.key])).filter(v => typeof v === 'number');
    max = niceMax(Math.max(...all, 0));
  }
  // ร้อยละและค่าเฉลี่ยแสดงทศนิยม 1 ตำแหน่งเสมอ
  const dec = o.dec !== null ? o.dec : 1;

  const slot = Math.max(o.slotMin, 16 * series.length + 30, 900 / n);
  const w = o.padL + o.padR + slot * n;
  const plotH = o.h - o.padT - o.padB;
  const y = v => o.padT + plotH * (1 - Math.max(0, Math.min(max, v || 0)) / max);
  const bw = Math.min(24, (slot - 14) / series.length);
  const gap = series.length > 4 ? 2 : 3;
  const vertical = bw < 20;          // แท่งแคบ -> วางตัวเลขแนวตั้งกันเลขชนกัน

  const grid = [0, .25, .5, .75, 1].map(f => {
    const v = max * f;
    return `<line x1="${o.padL}" x2="${w - o.padR}" y1="${y(v)}" y2="${y(v)}"
          stroke="var(--line)" stroke-width="1"/>
    <text x="${o.padL - 8}" y="${y(v) + 4}" text-anchor="end"
          font-size="10.5" fill="var(--muted)">${
            max <= 5 ? v.toFixed(1) : v.toFixed(0)}</text>`;
  }).join('');

  const bars = rows.map((r, i) => {
    const cx = o.padL + slot * i + slot / 2;
    const total = series.length * bw + (series.length - 1) * gap;
    return series.map((s, k) => {
      const v = r[s.key];
      if (typeof v !== 'number') return '';
      const x = cx - total / 2 + k * (bw + gap);
      const yy = y(v), hh = o.padT + plotH - yy;
      const cxb = x + bw / 2, txt = v.toFixed(dec);
      const label = vertical
        ? `<text transform="translate(${cxb},${yy - 5}) rotate(-90)" text-anchor="start"
             font-size="9" fill="${s.ink}" font-weight="700">${txt}</text>`
        : `<text x="${cxb}" y="${yy - 5}" text-anchor="middle"
             font-size="9.5" fill="${s.ink}" font-weight="700">${txt}</text>`;
      return `<g class="gb">
        <rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(1, hh)}"
              rx="3" fill="${s.c}"><title>${esc(r.name)}
${s.label}: ${txt}${o.suffix}</title></rect>${label}
      </g>`;
    }).join('');
  }).join('');

  const labels = rows.map((r, i) => {
    const cx = o.padL + slot * i + slot / 2;
    const nm = r.name.length > 16 ? r.name.slice(0, 15) + '…' : r.name;
    return o.flatLabels
      ? `<text x="${cx}" y="${o.h - o.padB + 18}" text-anchor="middle" font-size="11.5"
          fill="var(--ink2)" class="xl">${esc(nm)}</text>`
      : `<text transform="translate(${cx},${o.h - o.padB + 14}) rotate(-40)"
          text-anchor="end" font-size="10.5" fill="var(--ink2)" class="xl">${esc(nm)}</text>`;
  }).join('');

  const legend = series.map(s =>
    `<span class="lg"><i style="background:${s.c}"></i>${s.label}</span>`).join('');

  return `<div class="legend">${legend}</div>
    <div class="chartwrap"><svg viewBox="0 0 ${w} ${o.h}" width="${w}" height="${o.h}"
      preserveAspectRatio="xMinYMin meet">${grid}${bars}${labels}</svg></div>`;
}

// ---------- สรุปประเด็น (insight) ----------
const TONE_ICON = {good: '✔', warn: '!', bad: '▲', info: '•'};

function insightBlock(t) {
  const ins = t.insight || {};
  const sum = ins.summary || [], rows = ins.rows || [];
  if (!sum.length && !rows.length) return '';
  const rowWord = (t.row_label || '').replace(' (ปี)', '');
  return `<div class="insight">
    <div class="ihead">💡 สรุปประเด็นสำคัญ</div>
    <ul class="ilist">${sum.map(s =>
      `<li class="t-${s.tone}"><b>${TONE_ICON[s.tone] || '•'}</b>${esc(s.text)}</li>`).join('')}</ul>
    ${rows.length ? `<div class="isub">แยกราย${esc(rowWord)}</div>
      <div class="igrid">${rows.map(s =>
        `<div class="icard t-${s.tone}"><span class="ik">${esc(s.row)}</span>
          <span class="iv">${esc(s.text)}</span></div>`).join('')}</div>` : ''}
  </div>`;
}

// กราฟของตารางสถิติ (ตารางที่ 2-7) — ไม่ทำให้ตารางคุณภาพข้อมูล
function tableChart(t) {
  const names = t.metric_names || [];
  if (!names.length || t.kind === 'quality') return '';
  const uid = 'c' + (++CHART_SEQ) + '_';
  // ช่วงอายุที่ถูกแตกเป็นรายอายุ ให้กราฟแสดงแถวย่อยแทนแถวหลัก (ไม่งั้นนับซ้ำ)
  const split = new Set(t.rows.map(r => r._parent).filter(Boolean));
  const rows = t.rows
    .filter(r => String(r.row) !== 'รวม' && !split.has(String(r.row)))
    .map(r => ({...r, key: String(r.row),
                name: r._sub ? `${r.row} ปี` : String(r.row)}));
  if (!rows.length) return '';

  const pct = t.kind === 'count_pct';
  const series = names.map((n, i) => ({
    key: pct ? `${n}|ร้อยละ` : n, label: n, ...PALETTE[i % PALETTE.length]}));

  return `<div class="tchart">
    <div class="ctitle">${esc(t.row_label || '')} × ${pct ? 'ร้อยละ' : 'ค่าเฉลี่ยต่อคน'}</div>
    ${groupedBarChart(rows, series, {uid, h: 300, padB: 44, flatLabels: true,
      max: pct ? 100 : null, suffix: pct ? '%' : '', slotMin: 70})}
  </div>`;
}

function renderOverview(rows, labels, level) {
  const L = labels || {};

  const isDistrict = level !== 'unit';
  const unitName = isDistrict ? 'อำเภอ' : 'หน่วยบริการ';

  const series = [
    {key: 'examined_pct', label: 'ร้อยละได้รับการตรวจฟัน', c: '#14b8a6', ink: '#0f766e'},
    {key: 'caries_free_pct', label: 'ร้อยละ' + cfL, c: '#6366f1', ink: '#4338ca'},
  ];

  const tb = rows.map(r => `<tr class="${isDistrict ? 'clickable' : ''}"
      ${isDistrict ? `data-amp="${esc(r.key)}"` : ''}>
      <td>${r.code ? `<span class="code">${esc(r.code)}</span> ` : ''}${esc(r.name)}</td>
      <td>${fmt(r.target)}</td><td>${fmt(r.examined)}</td>
      <td class="pct2">${fmt(r.examined_pct, 2)}</td>
      <td>${fmt(r.qualified)}</td><td class="pct">${fmt(r.qualified_pct, 2)}</td>
      <td class="pct">${fmt(r.caries_free_pct, 2)}</td>
      <td>${fmt(r.dmft, 2)}</td>
      <td class="act">${(() => {
        const key = esc(r.key), nm = esc(r.name);
        const at = isDistrict ? 'data-amp' : 'data-hos';
        const b = [];
        if (r.pending > 0) b.push(`<button class="mini" ${at}="${key}" data-name="${nm}"
          data-kind="pending">ยังไม่ได้ตรวจ (${fmt(r.pending)})</button>`);
        if (r.failed > 0) b.push(`<button class="mini warn" ${at}="${key}" data-name="${nm}"
          data-kind="failed">ไม่ผ่านเกณฑ์ (${fmt(r.failed)})</button>`);
        return b.length ? b.join(' ') : '<span class="ok">ครบถ้วน</span>';

  const totalPending = rows.reduce((a, r) => a + (r.pending || 0), 0);

  const allLabel = isDistrict ? 'ทั้งหมดในขอบเขตนี้' : 'ทั้งอำเภอ';

  return `<section>
    <h2>${isDistrict ? '<span class="no">ภาพรวม</span>'

      เปรียบเทียบราย${unitName} (เรียงตามรหัส${unitName})
      <span class="hgrp">
      ${totalPending > 0 ? `<button class="mini" data-name="${allLabel}" data-kind="pending"
        >ยังไม่ได้ตรวจ${allLabel} (${fmt(totalPending)})</button>` : ''}
      ${totalFailed > 0 ? `<button class="mini warn" data-name="${allLabel}" data-kind="failed"
        >ไม่ผ่านเกณฑ์${allLabel} (${fmt(totalFailed)})</button>` : ''}
      </span>
      ${exportBtns('overview')}</h2>
    <div class="cond"><div>• ร้อยละได้รับการตรวจฟัน = จำนวนที่ตรวจ ÷ เด็กในเขตรับผิดชอบทั้งหมดในไฟล์</div>
      <div>• ร้อยละ${cfL} = คิดจากผู้ที่ผ่านเกณฑ์คุณภาพ</div>
      ${isDistrict ? '<div>• คลิกที่แถวเพื่อดูรายหน่วยบริการในอำเภอนั้น</div>' : ''}
      <div>• คอลัมน์ <b>ติดตาม</b> (ขวาสุดของตาราง): <b>ยังไม่ได้ตรวจ</b> = ยังไม่มีวันที่ตรวจ |
        <b>ไม่ผ่านเกณฑ์</b> = ตรวจแล้วแต่ข้อมูลตกเกณฑ์คุณภาพ ควรตามมาตรวจ/บันทึกใหม่</div></div>
    ${groupedBarChart(rows.filter(r => r.examined > 0), series,
      {uid: 'ov_', max: 100, suffix: '%', h: isDistrict ? 320 : 340,
       padB: isDistrict ? 92 : 130, slotMin: isDistrict ? 70 : 66})}
    <div class="tw"><table><thead><tr>

      <tbody>${tb}</tbody></table></div>
